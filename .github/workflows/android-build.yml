name: Build Caveman Vs Dragon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - AndroidAPK-MobileStartPrompt1
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Install Ripgrep
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rg --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Configure self-contained Android app
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.team2go.cavemanvsdragon',
            appName: 'Caveman Vs Dragon',
            webDir: 'dist',
            android: {
              allowMixedContent: false,
            },
          };

          export default config;
          EOF

      - name: Bundle game music
        shell: bash
        run: |
          BASE='https://8ca556b9-b5b4-4910-80b1-d14db143f4d8.lovableproject.com'

          mkdir -p public/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1
          mkdir -p public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57
          mkdir -p public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747
          mkdir -p public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89
          mkdir -p public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1/Gamemusic1.mp3" \
            -o public/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1/Gamemusic1.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3" \
            -o public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3" \
            -o public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3" \
            -o public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3" \
            -o public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3

      - name: Master Level 2+ music for phone speakers
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          L2='public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3'
          L3='public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3'
          L4='public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3'
          ENDING='public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3'

          # Level 2: preserve composition, make the narrow stereo image clearly audible,
          # add phone-relevant presence, compress/limit for much stronger
          # perceived loudness, and retain ~0.4 dB true-peak headroom.
          ffmpeg -y -loglevel error -i "$L2" \
            -af "highpass=f=70,stereotools=slev=8,equalizer=f=1200:t=q:w=1:g=2,acompressor=threshold=0.12:ratio=3:attack=5:release=80:makeup=2.0,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L2%.mp3}.mastered.mp3"
          mv "${L2%.mp3}.mastered.mp3" "$L2"

          # Level 3 is bass-heavier than Level 1; widen its narrow stereo image and shift energy into
          # the low-mid/presence range that phone speakers reproduce well.
          ffmpeg -y -loglevel error -i "$L3" \
            -af "highpass=f=80,stereotools=slev=8,equalizer=f=500:t=q:w=1:g=2,equalizer=f=1400:t=q:w=1:g=3,acompressor=threshold=0.12:ratio=3:attack=5:release=80:makeup=2.2,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L3%.mp3}.mastered.mp3"
          mv "${L3%.mp3}.mastered.mp3" "$L3"

          # Level 4 already has healthy stereo width, so do not widen it.
          # Only improve presence and perceived loudness.
          ffmpeg -y -loglevel error -i "$L4" \
            -af "highpass=f=60,equalizer=f=1000:t=q:w=1:g=1,acompressor=threshold=0.14:ratio=2.5:attack=5:release=80:makeup=1.7,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L4%.mp3}.mastered.mp3"
          mv "${L4%.mp3}.mastered.mp3" "$L4"

          # Ending: modest mastering only; no stereo-width manipulation.
          ffmpeg -y -loglevel error -i "$ENDING" \
            -af "highpass=f=60,acompressor=threshold=0.14:ratio=2.5:attack=5:release=80:makeup=1.5,alimiter=limit=0.65:attack=5:release=50:level=false" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${ENDING%.mp3}.mastered.mp3"
          mv "${ENDING%.mp3}.mastered.mp3" "$ENDING"

          # Sanity check every mastered asset before the web build.
          for f in "$L2" "$L3" "$L4" "$ENDING"; do
            test -s "$f"
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels \
              -of default=nw=1 "$f"
          done

          # Prove Level 2/3 contain meaningful left-right difference, not just
          # two nominal channels carrying nearly the same signal.
          python3 - "$L2" "$L3" <<'PY'
          import re
          import subprocess
          import sys

          def mean_volume(path: str, audio_filter: str) -> float:
              proc = subprocess.run(
                  [
                      'ffmpeg', '-hide_banner', '-nostats', '-i', path,
                      '-af', audio_filter, '-f', 'null', '-',
                  ],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              match = re.findall(r'mean_volume:\s*(-?\d+(?:\.\d+)?) dB', proc.stderr)
              if not match:
                  raise SystemExit(f'Unable to measure stereo width for {path}')
              return float(match[-1])

          for path in sys.argv[1:]:
              program = mean_volume(path, 'volumedetect')
              side = mean_volume(path, 'pan=mono|c0=FL-FR,volumedetect')
              side_gap = side - program
              print(
                  f'Stereo width {path}: program={program:.1f} dB, '
                  f'L-R={side:.1f} dB, side_gap={side_gap:.1f} dB'
              )
              if side_gap < -15.0:
                  raise SystemExit(
                      f'Stereo image is still too narrow for {path}: '
                      f'{side_gap:.1f} dB'
                  )
          PY

          echo 'Level 2+ phone-speaker mastering and stereo-width checks completed successfully'

      - name: Verify canonical audio and browser pause implementation
        shell: bash
        run: |
          set -euo pipefail

          # These transformations are canonical MainLevel2 source now. Keep
          # Android CI read-only here so source evolution cannot make an old
          # mutation script corrupt or reject an already-integrated change.
          rg -q 'htmlNativeLoop: true' src/components/game/bgMusic.ts
          rg -q 'volume: 0\.238' src/components/game/bgMusic.ts
          rg -q 'volume: 0\.258' src/components/game/bgMusic.ts
          rg -q 'volume: 0\.217' src/components/game/bgMusic.ts
          rg -q 'volume: 0\.311' src/components/game/bgMusic.ts
          rg -q 'function getSfxOutput' src/components/game/sounds.ts
          rg -q 'connect\(getSfxOutput\(ctx\)\)' src/components/game/sounds.ts
          rg -q 'sfxOutput\.connect\(audioCtx\.destination\)' src/components/game/sounds.ts
          if rg -q 'connect\(ctx\.destination\)' src/components/game/sounds.ts; then
            echo 'Direct SFX destination routing bypasses the canonical output bus.' >&2
            exit 1
          fi
          test "$(rg -o 'connect\(getSfxOutput\(ctx\)\)' src/components/game/sounds.ts | wc -l)" -ge 20
          rg -q 'export async function pauseBrowserSfx' src/components/game/sounds.ts
          rg -q 'export async function resumeBrowserSfx' src/components/game/sounds.ts
          rg -q 'function resumeSfxContext' src/components/game/sounds.ts
          rg -q "cvd-native-app-background" src/components/CavemanVsDragonGame.tsx
          rg -q "cvd-native-app-foreground" src/components/CavemanVsDragonGame.tsx
          rg -q "visibilitychange" src/components/CavemanVsDragonGame.tsx
          rg -q "document.visibilityState === 'hidden'" src/components/game/bgMusic.ts
          rg -Fq "anyInputHandlerRef.current?.(detail.key, 'pad')" src/components/CavemanVsDragonGame.tsx
          rg -Fq "keysRef.current.add(detail.key)" src/components/CavemanVsDragonGame.tsx
          rg -q 'if \(Capacitor\.isNativePlatform\(\)\) return true' src/components/game/sounds.ts
          rg -q 'PHONE_SFX_GAIN = 2\.4' src/components/game/sounds.ts
          rg -q 'export async function pauseBrowserMusic' src/components/game/bgMusic.ts
          rg -q 'export async function resumeBrowserMusic' src/components/game/bgMusic.ts
          rg -q 'pauseBrowserMusic\(\)' src/components/CavemanVsDragonGame.tsx
          rg -q 'resumeBrowserMusic\(\)' src/components/CavemanVsDragonGame.tsx
          echo 'Canonical audio routing, mix, and browser pause implementation verified.'

      - name: Patch Android layout and controller awareness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Native controller + iiRcade state. Use a single-line anchor so YAML
          # indentation cannot alter the source matcher.
          replace_once(
              "  const [gamepadActive, setGamepadActive] = useState<boolean>(false);",
              """  const [gamepadActive, setGamepadActive] = useState<boolean>(false);
          // Native Android fallback: detect attached controllers before the first
          // button press, and identify iiRcade hardware for its dedicated layout.
          const [nativeHardwareController, setNativeHardwareController] = useState<boolean>(false);
          const [isIiRcadeDevice, setIsIiRcadeDevice] = useState<boolean>(false);
          const [nativeTopCutoutInset, setNativeTopCutoutInset] = useState<number>(0);
          useEffect(() => {
            const pollNativeDevice = () => {
              try {
                const nativeBridge = (window as any).CvdNative;
                if (!nativeBridge) return;
                const iiRcade = Boolean(nativeBridge.isIiRcade?.());
                const controller = Boolean(nativeBridge.hasHardwareController?.());
                const cutoutInset = Number(nativeBridge.getTopCutoutInsetDp?.() ?? 0);
                const nativeControllerActive = controller || iiRcade;
                setIsIiRcadeDevice(iiRcade);
                setNativeHardwareController(nativeControllerActive);

                // IMPORTANT: the title prompt reads gamepadActive, not
                // nativeHardwareController. Keep both states synchronized so
                // a controller attached before first input shows START immediately.
                if (gamepadActiveRef.current !== nativeControllerActive) {
                  gamepadActiveRef.current = nativeControllerActive;
                  setGamepadActive(nativeControllerActive);
                }

                setNativeTopCutoutInset(
                  Number.isFinite(cutoutInset) ? Math.max(0, Math.round(cutoutInset)) : 0
                );
              } catch {
                // Browser/non-native builds do not expose CvdNative.
              }
            };
            pollNativeDevice();
            const timer = window.setInterval(pollNativeDevice, 500);
            return () => window.clearInterval(timer);
          }, []);

          useEffect(() => {
            // If a native controller is disconnected, clear the sticky
            // gamepad-active flag once the Web Gamepad API also sees none.
            if (!isNativeApp || nativeHardwareController || isIiRcadeDevice) return;
            const pads = navigator.getGamepads?.() ?? [];
            const anyConnected = Array.from(pads).some((pad) => !!pad?.connected);
            if (!anyConnected && gamepadActiveRef.current) {
              gamepadActiveRef.current = false;
              setGamepadActive(false);
            }
          }, [nativeHardwareController, isIiRcadeDevice]);""",
              'gamepad state block'
          )

          replace_once(
              "  const controlsVisible = isTouchDevice && !(isNativeApp && isTablet) && !gamepadActive && !(gameState === 'intro' || gameState === 'attractLocalLeaderboard' || gameState === 'attractGlobalLeaderboard' || gameState === 'attractControls' || gameState === 'enterName' || gameState === 'confirmName' || gameState === 'globalLeaderboard');",
              """  const controllerPresent = gamepadActive || nativeHardwareController || isIiRcadeDevice;
          const controlsVisible = isTouchDevice && !(isNativeApp && isTablet) && !controllerPresent && !(gameState === 'intro' || gameState === 'attractLocalLeaderboard' || gameState === 'attractGlobalLeaderboard' || gameState === 'attractControls' || gameState === 'enterName' || gameState === 'confirmName' || gameState === 'globalLeaderboard');""",
              'controls visibility block'
          )

          # Landscape: equal-width control rails with a flexible centered game area.
          replace_once(
              'className="h-full shrink-0 py-2 pl-[calc(env(safe-area-inset-left)+0.5rem)] pr-2 touch-none flex items-center"',
              'className="h-full w-[min(32vw,220px)] shrink-0 py-2 pl-[calc(env(safe-area-inset-left)+0.5rem)] pr-2 touch-none flex items-center"',
              'landscape D-pad rail'
          )

          replace_once(
              'className="h-[min(72vh,240px)] w-[min(48vw,240px)]"',
              'className="h-[min(72vh,220px)] w-full"',
              'landscape D-pad size'
          )

          replace_once(
              'className="relative flex min-h-0 w-full flex-1 items-center justify-center bg-black"',
              'className="relative flex min-h-0 min-w-0 flex-1 items-center justify-center bg-black"',
              'center game area'
          )

          replace_once(
              'className="h-full shrink-0 py-2 pr-[calc(env(safe-area-inset-right)+0.5rem)] pl-2 touch-none flex flex-col items-stretch justify-center gap-2 w-[min(36vw,180px)]"',
              'className="h-full w-[min(32vw,220px)] shrink-0 py-2 pr-[calc(env(safe-area-inset-right)+0.5rem)] pl-2 touch-none flex flex-col items-stretch justify-center gap-2"',
              'landscape JUMP rail'
          )

          # Native container aspect ratio: iiRcade gets full 5:4.
          aspect_pattern = re.compile(
              r"aspectRatio:\s*isLandscape\s*\n"
              r"\s*\?\s*\(isTablet \? '4 / 3' : '16 / 9'\)\s*\n"
              r"\s*:\s*\(isTablet \? '3 / 4' : '9 / 16'\),"
          )
          aspect_replacement = """aspectRatio: isIiRcadeDevice
                    ? '5 / 4'
                    : isLandscape
                      ? (isTablet ? '4 / 3' : '16 / 9')
                      : (isTablet ? '3 / 4' : '9 / 16'),"""
          s, count = aspect_pattern.subn(aspect_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'native aspect-ratio block: expected 1 match, found {count}')

          # Canvas itself also fills the iiRcade 5:4 area.
          replace_once(
              'className="block max-h-full max-w-full h-auto w-auto"',
              'className="block max-h-full max-w-full"',
              'canvas class'
          )
          replace_once(
              'aspectRatio: `${CANVAS_W} / ${CANVAS_H}`,',
              "aspectRatio: isIiRcadeDevice ? '5 / 4' : `${CANVAS_W} / ${CANVAS_H}`,",
              'canvas aspect ratio'
          )

          canvas_width_pattern = re.compile(
              r"(aspectRatio:\s*isIiRcadeDevice\s*\?\s*'5 / 4'\s*:\s*`\$\{CANVAS_W\} / \$\{CANVAS_H\}`,\s*\n"
              r"\s*height:\s*'100%',\s*\n)\s*width:\s*'auto',"
          )
          s, count = canvas_width_pattern.subn(
              r"\1                      width: isIiRcadeDevice ? '100%' : 'auto',",
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(f'canvas width block: expected 1 match, found {count}')

          # Portrait camera cutout: move only the game screen downward by the
          # native display-cutout safe inset. The control bar is intentionally
          # untouched, and landscape/iiRcade layouts are unaffected.
          native_style_pattern = re.compile(
              r"maxHeight:\s*'100%',\s*\n"
              r"\s*maxWidth:\s*'100%',"
          )
          native_style_replacement = """maxHeight: '100%',
                  maxWidth: '100%',
                  transform: !isLandscape && nativeTopCutoutInset > 0
                    ? `translateY(${nativeTopCutoutInset}px)`
                    : undefined,"""
          s, count = native_style_pattern.subn(
              native_style_replacement,
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(
                  f'portrait camera-cutout game offset: expected 1 match, found {count}'
              )

          # APK haptics: prefer the native bridge while retaining the canonical
          # browser vibration helper as fallback. MainLevel2 now keeps the web
          # implementation in vibrateWebControl(), so patch that stable call.
          vibrate_old = "  const vibrateNow = (ms: number) => vibrateWebControl(ms);"
          vibrate_new = """  const vibrateNow = (ms: number) => {
            const duration = Math.max(18, Math.round(ms));
            try {
              const nativeBridge = (window as any).CvdNative;
              if (nativeBridge && typeof nativeBridge.vibrate === 'function') {
                nativeBridge.vibrate(duration);
                return true;
              }
            } catch {}
            return vibrateWebControl(duration);
          };"""
          if 'nativeBridge.vibrate(duration);' in s:
              print('Native haptics bridge already present')
          elif s.count(vibrate_old) == 1:
              s = s.replace(vibrate_old, vibrate_new, 1)
          else:
              raise SystemExit(
                  f'vibrateNow canonical block: expected 1 match, found {s.count(vibrate_old)}'
              )

          # Portrait native controls: center the 152px control row vertically
          # in the space below the game instead of letting it touch the phone bottom.
          replace_once(
              'className={`w-full shrink-0 overflow-hidden px-2 pt-2 touch-none ${isNativeApp ? \'pb-0 -mt-2\' : \'pb-[calc(env(safe-area-inset-bottom)+0.5rem)]\'}`}',
              'className={`w-full shrink-0 overflow-hidden px-2 touch-none ${isNativeApp ? \'py-[clamp(24px,4vh,48px)]\' : \'pt-2 pb-[calc(env(safe-area-inset-bottom)+0.5rem)]\'}`}',
              'portrait control centering'
          )

          p.write_text(s)
          print('Android layout/controller/native-haptics/portrait-centering/cutout-offset patch applied successfully')
          PY

      - name: Disable duplicate Web Gamepad path in native APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          old = (
              "  // ============= Gamepad API polling (PC + browsers that expose it) =============\n"
              "  // Standard mapping: 0=A (jump), 9=Start, 12/13/14/15 = DPAD up/down/left/right.\n"
              "  // Left stick: axes[0] (x), axes[1] (y). Threshold 0.4.\n"
              "  useEffect(() => {\n"
              "    let raf = 0;"
          )
          new = (
              "  // ============= Gamepad API polling (PC + browsers that expose it) =============\n"
              "  // Native APK controller input is handled by MainActivity instead, preventing\n"
              "  // duplicate native + Web Gamepad delivery from fighting over held state.\n"
              "  // Browser/PC keeps the existing standard Gamepad API path.\n"
              "  useEffect(() => {\n"
              "    if (isNativeApp) return;\n"
              "    let raf = 0;"
          )

          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Native Gamepad bypass: expected 1 match, found {count}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          gm = p.read_text()
          mark_idx = gm.find('const markGamepadActive')
          toggle_idx = gm.find('const toggleWebPause')
          listener_idx = gm.find("window.addEventListener('cvd-native-controller-key'")
          if not (0 <= mark_idx < toggle_idx < listener_idx):
              raise SystemExit(
                  f'Runtime hook order invalid: mark={mark_idx}, '
                  f'toggle={toggle_idx}, listener={listener_idx}'
              )
          if 'if (isNativeApp) return;' not in gm:
              raise SystemExit('Native Gamepad bypass assertion failed')

          print('Native controller runtime ordering and duplicate-path bypass verified')
          PY

      - name: Force Android APK start-screen mode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          # Android APK is always a mobile environment. useIsMobile() is a
          # viewport-width hook, so a phone in landscape can incorrectly become
          # "desktop". Force Android mobile classification for every game screen,
          # including post-game/global leaderboards.
          old_mobile = "  const isMobile = useIsMobile();"
          new_mobile = "  const isMobile = true; // Android APK build: never use PC prompts"
          if s.count(old_mobile) != 1:
              raise SystemExit(
                  f'Android isMobile override: expected 1 match, found {s.count(old_mobile)}'
              )
          s = s.replace(old_mobile, new_mobile, 1)

          # The post-game/global leaderboard renderer reads isMobileRef.
          # Force it mobile too so landscape can never display PC-only wording.
          old_mobile_ref = "  useEffect(() => { isMobileRef.current = isMobile; }, [isMobile]);"
          new_mobile_ref = "  useEffect(() => { isMobileRef.current = true; }, []); // Android APK build"
          if s.count(old_mobile_ref) != 1:
              raise SystemExit(
                  f'Android isMobileRef override: expected 1 match, found {s.count(old_mobile_ref)}'
              )
          s = s.replace(old_mobile_ref, new_mobile_ref, 1)

          old_ui = "  const mobileStartUi = isNativeApp || isMobile;"
          new_ui = "  const mobileStartUi = true; // Android APK build"
          if s.count(old_ui) != 1:
              raise SystemExit(
                  f'Android mobileStartUi override: expected 1 match, found {s.count(old_ui)}'
              )
          s = s.replace(old_ui, new_ui, 1)

          # Preserve the shared attract timer in Android. It now uses the
          # same mobile sequence as touch/controller navigation:
          # title -> local -> global -> title.
          attract_markers = [
              "const moveAttractScreen = useCallback",
              "window.setTimeout(() => moveAttractScreen(1), 5000)",
              "adjacentAttractScreen(current, mobileStartUi, direction)",
          ]
          missing_attract = [marker for marker in attract_markers if marker not in s]
          if missing_attract:
              raise SystemExit(
                  'Android attract navigation markers missing: ' + ', '.join(missing_attract)
              )

          # Android APK must never expose the PC-only R-key instruction.
          # This runs only inside the Android Actions build, so the browser/PC
          # source keeps its normal R-key wording.
          r_prompt_count = (
              s.count("Press R to Start") +
              s.count("PRESS R TO START")
          )
          if r_prompt_count < 1:
              raise SystemExit(
                  'Android R-prompt scrub expected at least one PC prompt, found none'
              )

          s = s.replace("Press R to Start", "Touch Screen to Start")
          s = s.replace("PRESS R TO START", "TOUCH SCREEN TO START")

          if "Press R to Start" in s or "PRESS R TO START" in s:
              raise SystemExit('Android R-prompt scrub failed')

          print(
              f'Android PC-only R prompt scrubbed: '
              f'{r_prompt_count} occurrence(s) removed'
          )

          p.write_text(s)

          check = p.read_text()
          required = {
              'APK environment forced mobile':
                  'const isMobile = true; // Android APK build: never use PC prompts' in check,
              'Post-game mobile ref forced':
                  'isMobileRef.current = true' in check,
              'APK mobile UI forced': 'const mobileStartUi = true; // Android APK build' in check,
              'APK attract timer enabled':
                  'window.setTimeout(() => moveAttractScreen(1), 5000)' in check,
              'Touch prompt present': check.count("Touch Screen to Start") >= 2,
              'START prompt present': check.count("Press START to Start") >= 2,
              'PC R prompt absent from Android source':
                  "Press R to Start" not in check and "PRESS R TO START" not in check,
          }
          failed = [name for name, ok in required.items() if not ok]
          for name, ok in required.items():
              print(('OK: ' if ok else 'FAIL: ') + name)
          if failed:
              raise SystemExit('Android APK start-screen assertion failed: ' + ', '.join(failed))

          print('Android APK start-screen navigation verified')
          PY

      - name: Fix Android leaderboard restart and background audio gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          # Replace any remaining legacy post-game PRESS R prompt.
          # GAME OVER now uses any-button restart, leaving one leaderboard prompt.
          restart_pattern = re.compile(r"(['\"])PRESS R TO RESTART\1")
          replacement = (
              "(gamepadActiveRef.current ? "
              "'PRESS START TO START' : 'TOUCH SCREEN TO START')"
          )
          s, restart_count = restart_pattern.subn(replacement, s)
          if restart_count < 1:
              raise SystemExit(
                  f'Expected at least 1 PRESS R TO RESTART string, found {restart_count}'
              )
          print(f'OK: replaced {restart_count} PRESS R TO RESTART prompt(s)')

          # MainLevel2 now owns terminal-screen restart routing through the
          # unified input handler. Do not patch a legacy native START effect:
          # the current `if (key === 'Start')` belongs to the name-entry overlay.
          if "gameState !== 'gameover' && gameState !== 'leaderboard' && gameState !== 'globalLeaderboard'" not in s:
              raise SystemExit('Canonical terminal-screen restart handler not found')
          print('OK: canonical terminal-screen restart routing present')

          # Persistent Android audio gate: block future HTML media play() calls
          # while the app is backgrounded/hidden. This fixes delayed BGM starts.
          native_marker = 'const isNativeApp = Capacitor.isNativePlatform();'
          if s.count(native_marker) != 1:
              raise SystemExit(
                  f'isNativeApp marker: expected 1 match, found {s.count(native_marker)}'
              )

          gate = r'''
          // Android APK lifecycle audio gate. Prevent delayed BGM/media starts
          // from beginning after the app has already entered the background.
          if (isNativeApp && typeof window !== 'undefined') {
            const cvdWindow = window as any;
            if (!cvdWindow.__cvdAndroidAudioGateInstalled) {
              cvdWindow.__cvdAndroidAudioGateInstalled = true;
              cvdWindow.__cvdAndroidBackgrounded =
                document.visibilityState === 'hidden';
              if (typeof cvdWindow.__cvdAndroidGamePaused !== 'boolean') {
                cvdWindow.__cvdAndroidGamePaused = false;
              }

              const originalMediaPlay = HTMLMediaElement.prototype.play;
              HTMLMediaElement.prototype.play = function(): Promise<void> {
                if (
                  cvdWindow.__cvdAndroidBackgrounded ||
                  cvdWindow.__cvdAndroidGamePaused ||
                  document.visibilityState === 'hidden'
                ) {
                  return Promise.resolve();
                }
                return originalMediaPlay.call(this);
              };

              window.addEventListener('cvd-native-app-background', () => {
                cvdWindow.__cvdAndroidBackgrounded = true;
              });
              window.addEventListener('cvd-native-app-foreground', () => {
                cvdWindow.__cvdAndroidBackgrounded = false;
              });
              document.addEventListener('visibilitychange', () => {
                cvdWindow.__cvdAndroidBackgrounded =
                  document.visibilityState === 'hidden';
              });
            }
          }
          '''
          if '__cvdAndroidAudioGateInstalled' not in s:
              s = s.replace(native_marker, native_marker + gate, 1)
              print('OK: persistent Android media play gate installed')
          else:
              print('OK: Android media play gate already present')

          p.write_text(s)
          check = p.read_text()
          required = {
              'no Android PRESS R TO RESTART': 'PRESS R TO RESTART' not in check,
              'START leaderboard prompt': 'PRESS START TO START' in check,
              'touch leaderboard prompt': 'TOUCH SCREEN TO START' in check,
              'canonical terminal-screen restart behavior':
                  "gameState !== 'gameover'" in check
                  and "gameState !== 'leaderboard'" in check
                  and "gameState !== 'globalLeaderboard'" in check,
              'persistent media gate':
                  '__cvdAndroidAudioGateInstalled' in check
                  and '__cvdAndroidBackgrounded' in check
                  and '__cvdAndroidGamePaused' in check
                  and 'HTMLMediaElement.prototype.play' in check,
              'background event': 'cvd-native-app-background' in check,
              'foreground event': 'cvd-native-app-foreground' in check,
          }
          failed = [name for name, ok in required.items() if not ok]
          for name, ok in required.items():
              print(('OK: ' if ok else 'FAIL: ') + name)
          if failed:
              raise SystemExit('Fix 9 web verification failed: ' + ', '.join(failed))
          print('ALL FIX 9 WEB SOURCE ASSERTIONS PASSED.')
          PY

