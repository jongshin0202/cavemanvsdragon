name: Build Caveman Vs Dragon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - AndroidAPK-ControllerFix1
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Configure self-contained Android app
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.team2go.cavemanvsdragon.controllerfix1',
            appName: 'CVD Controller Fix 1',
            webDir: 'dist',
            android: {
              allowMixedContent: false,
            },
          };

          export default config;
          EOF

      - name: Bundle game music
        shell: bash
        run: |
          BASE='https://8ca556b9-b5b4-4910-80b1-d14db143f4d8.lovableproject.com'

          mkdir -p public/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1
          mkdir -p public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57
          mkdir -p public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747
          mkdir -p public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89
          mkdir -p public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1/Gamemusic1.mp3" \
            -o public/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1/Gamemusic1.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3" \
            -o public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3" \
            -o public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3" \
            -o public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3" \
            -o public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3

      - name: Master Level 2+ music for phone speakers
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          L2='public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3'
          L3='public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3'
          L4='public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3'
          ENDING='public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3'

          # Level 2: preserve composition, widen the tiny existing stereo side,
          # add phone-relevant presence, compress/limit for much stronger
          # perceived loudness, and retain ~0.4 dB true-peak headroom.
          ffmpeg -y -loglevel error -i "$L2" \
            -af "highpass=f=70,stereotools=slev=4,equalizer=f=1200:t=q:w=1:g=2,acompressor=threshold=0.12:ratio=3:attack=5:release=80:makeup=2.0,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L2%.mp3}.mastered.mp3"
          mv "${L2%.mp3}.mastered.mp3" "$L2"

          # Level 3 is bass-heavier than Level 1, so shift more energy into
          # the low-mid/presence range that phone speakers reproduce well.
          ffmpeg -y -loglevel error -i "$L3" \
            -af "highpass=f=80,stereotools=slev=4,equalizer=f=500:t=q:w=1:g=2,equalizer=f=1400:t=q:w=1:g=3,acompressor=threshold=0.12:ratio=3:attack=5:release=80:makeup=2.2,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L3%.mp3}.mastered.mp3"
          mv "${L3%.mp3}.mastered.mp3" "$L3"

          # Level 4 already has healthy stereo width, so do not widen it.
          # Only improve presence and perceived loudness.
          ffmpeg -y -loglevel error -i "$L4" \
            -af "highpass=f=60,equalizer=f=1000:t=q:w=1:g=1,acompressor=threshold=0.14:ratio=2.5:attack=5:release=80:makeup=1.7,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L4%.mp3}.mastered.mp3"
          mv "${L4%.mp3}.mastered.mp3" "$L4"

          # Ending: modest mastering only; no stereo-width manipulation.
          ffmpeg -y -loglevel error -i "$ENDING" \
            -af "highpass=f=60,acompressor=threshold=0.14:ratio=2.5:attack=5:release=80:makeup=1.5,alimiter=limit=0.65:attack=5:release=50:level=false" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${ENDING%.mp3}.mastered.mp3"
          mv "${ENDING%.mp3}.mastered.mp3" "$ENDING"

          # Sanity check every mastered asset before the web build.
          for f in "$L2" "$L3" "$L4" "$ENDING"; do
            test -s "$f"
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels \
              -of default=nw=1 "$f"
          done

          echo 'Level 2+ phone-speaker mastering completed successfully'

      - name: Balance all BGM to Level 1 loudness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/game/bgMusic.ts')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Keep Level 1 exactly unchanged. The later-track values compensate
          # for the measured LUFS of the mastered files so their effective
          # playback loudness matches Level 1 at VOL=0.333.
          replace_once(
              "  crossfadeSec: number;\n};",
              "  crossfadeSec: number;\n  volume?: number;\n};",
              'Track volume field'
          )

          replacements = [
              (
                  "  level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC },",
                  "  level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: VOL },",
                  'Level 1 volume'
              ),
              (
                  "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2 },",
                  "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 0.238 },",
                  'Level 2 balanced volume'
              ),
              (
                  "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3 },",
                  "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 0.258 },",
                  'Level 3 balanced volume'
              ),
              (
                  "  level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC },",
                  "  level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 0.217 },",
                  'Level 4 balanced volume'
              ),
              (
                  "  ending: { url: musicEndingAsset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC },",
                  "  ending: { url: musicEndingAsset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 0.311 },",
                  'Ending balanced volume'
              ),
          ]
          for old, new, label in replacements:
              replace_once(old, new, label)

          replace_once(
              "  gain.gain.value = VOL;",
              "  gain.gain.value = t.volume ?? VOL;",
              'WebAudio gain'
          )
          replace_once(
              "    const outV = Math.cos((p * Math.PI) / 2) * VOL;\n    const inV = Math.sin((p * Math.PI) / 2) * VOL;",
              "    const tv = t.volume ?? VOL;\n    const outV = Math.cos((p * Math.PI) / 2) * tv;\n    const inV = Math.sin((p * Math.PI) / 2) * tv;",
              'Crossfade volume'
          )
          replace_once(
              "  try { t.a.pause(); t.a.currentTime = 0; t.a.volume = VOL; } catch { /* ignore */ }",
              "  try { t.a.pause(); t.a.currentTime = 0; t.a.volume = t.volume ?? VOL; } catch { /* ignore */ }",
              'HTMLAudio start volume'
          )

          p.write_text(s)

          required = [
              "level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: VOL }",
              "level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 0.238 }",
              "level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 0.258 }",
              "level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 0.217 }",
              "ending: { url: musicEndingAsset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 0.311 }",
              "t.a.volume = t.volume ?? VOL;",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Balanced-BGM assertion failed: {missing}')

          print('Balanced BGM playback volumes:')
          print('  Level 1  = 0.333')
          print('  Level 2  = 0.238')
          print('  Level 3  = 0.258')
          print('  Level 4  = 0.217')
          print('  Ending   = 0.311')
          PY

      - name: Route all BGM through HTMLAudio stereo paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/game/bgMusic.ts')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Level 1, Level 4 and Ending already use the HTMLAudio crossfade
          # path because their crossfadeSec is > 0.
          #
          # Level 2 and Level 3 are the only tracks that normally enter the
          # Web Audio AudioBufferSourceNode path. Mark those two for an
          # explicit HTMLAudioElement native-loop route instead.
          replace_once(
              "  volume?: number;\n};",
              "  volume?: number;\n  htmlNativeLoop?: boolean;\n};",
              'HTML native-loop field'
          )

          replace_once(
              "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 0.238 },",
              "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 0.238, htmlNativeLoop: true },",
              'Level 2 HTMLAudio route'
          )

          replace_once(
              "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 0.258 },",
              "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 0.258, htmlNativeLoop: true },",
              'Level 3 HTMLAudio route'
          )

          # Insert the HTMLAudio native-loop route immediately before the
          # existing Web Audio branch. Match only the branch line itself so
          # whitespace/comments cannot break the workflow matcher.
          needle = "  if (t.crossfadeSec <= 0) {"
          if s.count(needle) != 1:
              raise SystemExit(
                  f'WebAudio play branch: expected 1 match, found {s.count(needle)}'
              )

          html_loop_block = """  if (t.htmlNativeLoop) {
            // Android stereo-preserving route for Level 2/3.
            // Use ordinary HTML media playback, same playback family as
            // Level 1/4/Ending, instead of AudioBufferSourceNode.
            stopWebAudio(t);
            clearTimers(t);
            if (!t.a) t.a = makeAudio(t.url);
            try {
              t.a.pause();
              t.a.currentTime = 0;
              t.a.loop = true;
              t.a.volume = t.volume ?? VOL;
              t.active = t.a;
              void t.a.play().catch(() => {});
            } catch { /* ignore */ }
            return;
          }

          """

          s = s.replace(needle, html_loop_block + needle, 1)

          p.write_text(s)

          # Explicitly prove that every Android BGM track resolves to an
          # HTMLAudio route:
          #   L1       crossfade HTMLAudio
          #   L2       native-loop HTMLAudio
          #   L3       native-loop HTMLAudio
          #   L4       crossfade HTMLAudio
          #   Ending   crossfade HTMLAudio
          required = {
              'Level 1 HTMLAudio crossfade':
                  "level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: VOL }",
              'Level 2 HTMLAudio native loop':
                  "level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 0.238, htmlNativeLoop: true }",
              'Level 3 HTMLAudio native loop':
                  "level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 0.258, htmlNativeLoop: true }",
              'Level 4 HTMLAudio crossfade':
                  "level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 0.217 }",
              'Ending HTMLAudio crossfade':
                  "ending: { url: musicEndingAsset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 0.311 }",
              'Native HTMLAudio loop implementation':
                  "t.a.loop = true;",
          }

          missing = [label for label, fragment in required.items() if fragment not in s]
          if missing:
              raise SystemExit(f'All-stereo routing assertion failed: {missing}')

          # No defined BGM track is allowed to reach WebAudio:
          # only zero-crossfade tracks can enter that branch, and both
          # zero-crossfade tracks are now intercepted by htmlNativeLoop.
          if "level2: 0" not in s or "level3: 0" not in s:
              raise SystemExit('Unexpected crossfade override configuration')

          print('Android BGM route verification:')
          print('  Level 1  -> HTMLAudio crossfade @ 0.333')
          print('  Level 2  -> HTMLAudio native loop @ 0.238')
          print('  Level 3  -> HTMLAudio native loop @ 0.258')
          print('  Level 4  -> HTMLAudio crossfade @ 0.217')
          print('  Ending   -> HTMLAudio crossfade @ 0.311')
          print('  WebAudio -> unreachable by all five BGM tracks')
          PY

      - name: Balance completion SFX against BGM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/game/sounds.ts')
          s = p.read_text()

          def get_block(name: str):
              token = f'export function {name}('
              start = s.find(token)
              if start < 0:
                  raise SystemExit(f'Missing sound function: {name}')
              nxt = s.find('\nexport function ', start + len(token))
              if nxt < 0:
                  nxt = len(s)
              return start, nxt, s[start:nxt]

          def patch_block(name: str, replacements):
              global s
              start, end, block = get_block(name)
              for old, new, label in replacements:
                  count = block.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}/{label}: expected 1 match, found {count}')
                  block = block.replace(old, new, 1)
              s = s[:start] + block + s[end:]

          # All BGM is now normalized to Level 1. Leave ordinary gameplay and
          # cinematic effects unchanged because their existing dynamics are
          # intentional. Raise critical state cues just enough to stay clearly
          # audible over the music.
          patch_block('playWinSound', [
              (
                  'gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);',
                  'gain.gain.setValueAtTime(0.22, ctx.currentTime + i * 0.15);',
                  'win melody'
              ),
          ])

          patch_block('playGameOverSound', [
              (
                  'gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.2);',
                  'gain.gain.setValueAtTime(0.20, ctx.currentTime + i * 0.2);',
                  'game over melody'
              ),
          ])

          patch_block('playPrincessSavedSound', [
              (
                  'gain.gain.setValueAtTime(0.13, t);',
                  'gain.gain.setValueAtTime(0.20, t);',
                  'princess melody'
              ),
              (
                  'gain.gain.setValueAtTime(0.10, chordT);',
                  'gain.gain.setValueAtTime(0.15, chordT);',
                  'princess chord'
              ),
              (
                  'sparkleGain.gain.setValueAtTime(0.10, ts);',
                  'sparkleGain.gain.setValueAtTime(0.15, ts);',
                  'princess sparkle'
              ),
          ])

          p.write_text(s)

          checks = [
              'gain.gain.setValueAtTime(0.22, ctx.currentTime + i * 0.15);',
              'gain.gain.setValueAtTime(0.20, ctx.currentTime + i * 0.2);',
              'gain.gain.setValueAtTime(0.20, t);',
              'gain.gain.setValueAtTime(0.15, chordT);',
              'sparkleGain.gain.setValueAtTime(0.15, ts);',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(f'SFX mix assertion failed: {missing}')

          print('Critical SFX mix:')
          print('  Win melody:       0.15 -> 0.22')
          print('  Game over:        0.15 -> 0.20')
          print('  Princess melody:  0.13 -> 0.20')
          print('  Princess chord:   0.10 -> 0.15')
          print('  Princess sparkle: 0.10 -> 0.15')
          print('  Other SFX: unchanged')
          PY

      - name: Balance all SFX through master bus
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/game/sounds.ts')
          s = p.read_text()

          # Remove the previous one-off completion-cue boosts so every SFX is
          # handled by the same master mix bus.
          reversions = [
              (
                  'gain.gain.setValueAtTime(0.22, ctx.currentTime + i * 0.15);',
                  'gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);',
                  'win cue reset'
              ),
              (
                  'gain.gain.setValueAtTime(0.20, ctx.currentTime + i * 0.2);',
                  'gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.2);',
                  'game-over cue reset'
              ),
              (
                  'gain.gain.setValueAtTime(0.20, t);',
                  'gain.gain.setValueAtTime(0.13, t);',
                  'princess melody reset'
              ),
              (
                  'gain.gain.setValueAtTime(0.15, chordT);',
                  'gain.gain.setValueAtTime(0.10, chordT);',
                  'princess chord reset'
              ),
              (
                  'sparkleGain.gain.setValueAtTime(0.15, ts);',
                  'sparkleGain.gain.setValueAtTime(0.10, ts);',
                  'princess sparkle reset'
              ),
          ]
          for old, new, label in reversions:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Route every existing Web Audio SFX output through a shared master bus.
          direct_count = s.count('connect(ctx.destination)')
          if direct_count < 10:
              raise SystemExit(f'Expected many direct SFX outputs, found only {direct_count}')
          s = s.replace('connect(ctx.destination)', 'connect(getSfxBus())')

          marker = """function getCtx(): AudioContext {
            if (!audioCtx) audioCtx = new AudioContext();
            return audioCtx;
          }

          """
          if marker not in s:
              raise SystemExit('getCtx() marker not found')

          bus_code = """let sfxBus: GainNode | null = null;
          let sfxCompressor: DynamicsCompressorNode | null = null;

          function getSfxBus(): AudioNode {
            const ctx = getCtx();
            if (!sfxBus || !sfxCompressor) {
              sfxBus = ctx.createGain();
              sfxCompressor = ctx.createDynamicsCompressor();

              // Raise quiet gameplay cues on Android/WebView.
              sfxBus.gain.value = 2.75;

              // Prevent strong effects from becoming painfully loud.
              sfxCompressor.threshold.value = -18;
              sfxCompressor.knee.value = 18;
              sfxCompressor.ratio.value = 4;
              sfxCompressor.attack.value = 0.003;
              sfxCompressor.release.value = 0.18;

              sfxBus.connect(sfxCompressor);
              sfxCompressor.connect(ctx.destination);
            }
            return sfxBus;
          }

          """
          s = s.replace(marker, marker + bus_code, 1)
          p.write_text(s)

          checks = [
              'sfxBus.gain.value = 2.75;',
              'sfxCompressor.threshold.value = -18;',
              'sfxCompressor.ratio.value = 4;',
              'sfxCompressor.connect(ctx.destination);',
              'connect(getSfxBus())',
              'gain.gain.setValueAtTime(0.15, ctx.currentTime + i * 0.15);',
              'gain.gain.setValueAtTime(0.13, t);',
          ]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit(f'All-SFX bus assertion failed: {missing}')

          remaining_direct = s.count('connect(ctx.destination)')
          if remaining_direct != 1:
              raise SystemExit(
                  f'Expected exactly 1 direct destination connection (compressor), found {remaining_direct}'
              )

          print(f'Routed {direct_count} SFX outputs through shared master bus')
          print('SFX master gain: 2.75x (+25% vs v28)')
          print('Compressor: threshold -18 dB, ratio 4:1')
          print('All SFX now share one master mix bus')
          PY

      - name: Boost post-watering sprout and vine SFX 75 percent more
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/game/sounds.ts')
          s = p.read_text()

          def get_block(name: str):
              token = f'export function {name}('
              start = s.find(token)
              if start < 0:
                  raise SystemExit(f'Missing sound function: {name}')
              nxt = s.find('\nexport function ', start + len(token))
              if nxt < 0:
                  nxt = len(s)
              return start, nxt, s[start:nxt]

          def patch_block(name: str, replacements):
              global s
              start, end, block = get_block(name)
              for old, new, label in replacements:
                  count = block.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}/{label}: expected 1 match, found {count}')
                  block = block.replace(old, new, 1)
              s = s[:start] + block + s[end:]

          # v30 already applied +25% globally to all SFX.
          # This build raises the entire post-watering growth sequence another
          # 75% over v30, because filtered noise + sine waves translate more
          # quietly on phone speakers than square/triangle gameplay cues.
          #
          # Relative to the original local values:
          #   0.12 -> 0.315  (water/sprout noise)
          #   0.08 -> 0.210  (sprout rising tone)
          #   0.10 -> 0.2625 (vine organic noise)
          #   0.07 -> 0.18375 (vine rising notes)
          #   0.12 -> 0.315  (final bloom chime)

          patch_block('playWaterSproutSound', [
              (
                  'noiseGain.gain.setValueAtTime(0.12, ctx.currentTime);',
                  'noiseGain.gain.setValueAtTime(0.315, ctx.currentTime);',
                  'water sprout noise'
              ),
              (
                  'oscGain.gain.setValueAtTime(0.08, ctx.currentTime + 0.05);',
                  'oscGain.gain.setValueAtTime(0.210, ctx.currentTime + 0.05);',
                  'water sprout rising tone'
              ),
          ])

          patch_block('playVineGrowSound', [
              (
                  'noiseGain.gain.setValueAtTime(0.10, t0);',
                  'noiseGain.gain.setValueAtTime(0.2625, t0);',
                  'vine organic noise'
              ),
              (
                  'gain.gain.setValueAtTime(0.07, t);',
                  'gain.gain.setValueAtTime(0.18375, t);',
                  'vine rising notes'
              ),
              (
                  'cg.gain.setValueAtTime(0.12, tc);',
                  'cg.gain.setValueAtTime(0.315, tc);',
                  'vine bloom chime'
              ),
          ])

          p.write_text(s)

          required = [
              'noiseGain.gain.setValueAtTime(0.315, ctx.currentTime);',
              'oscGain.gain.setValueAtTime(0.210, ctx.currentTime + 0.05);',
              'noiseGain.gain.setValueAtTime(0.2625, t0);',
              'gain.gain.setValueAtTime(0.18375, t);',
              'cg.gain.setValueAtTime(0.315, tc);',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Post-watering growth boost assertion failed: {missing}')

          print('Music: unchanged from v30')
          print('All non-growth SFX: unchanged from v30')
          print('Post-watering sprout/vine sequence: +75% vs v30')
          print('Shared SFX master gain remains 2.75x')
          PY

      - name: Implement true tap-to-pause with exact audio resume
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # --- Background music: preserve exact currentTime and crossfade progress ---
          p = Path('src/components/game/bgMusic.ts')
          s = p.read_text()

          stop_all = """export function stopAllMusic() {
            for (const k of Object.keys(tracks)) stop(k);
          }
          """
          if s.count(stop_all) != 1:
              raise SystemExit(f'bgMusic stopAllMusic: expected 1 match, found {s.count(stop_all)}')

          pause_music = r"""
          type GamePauseMusicSnapshot = {
            playingElements: HTMLAudioElement[];
            active?: HTMLAudioElement;
            fadeProgress: number | null;
          };

          const gamePauseMusicSnapshots = new Map<string, GamePauseMusicSnapshot>();
          let gamePauseMusicActive = false;
          let gamePauseWebAudioWasRunning = false;

          export async function pauseAllMusicForGamePause() {
            if (gamePauseMusicActive) return;
            gamePauseMusicActive = true;
            gamePauseMusicSnapshots.clear();

            gamePauseWebAudioWasRunning = !!audioCtx && audioCtx.state === 'running';
            if (gamePauseWebAudioWasRunning && audioCtx) {
              try { await audioCtx.suspend(); } catch { /* ignore */ }
            }

            for (const [key, t] of Object.entries(tracks)) {
              if (!t.playing) continue;
              const elements = [t.a, t.b].filter((el): el is HTMLAudioElement => !!el);
              const playingElements = elements.filter((el) => !el.paused);

              let fadeProgress: number | null = null;
              if (t.fadeTimer && t.active && t.crossfadeSec > 0 && playingElements.length > 1) {
                const tv = t.volume ?? VOL;
                if (tv > 0) {
                  const ratio = Math.max(0, Math.min(1, t.active.volume / tv));
                  fadeProgress = (2 / Math.PI) * Math.asin(ratio);
                }
              }

              gamePauseMusicSnapshots.set(key, {
                playingElements,
                active: t.active,
                fadeProgress,
              });

              clearTimers(t);
              for (const el of playingElements) {
                try { el.pause(); } catch { /* ignore */ }
              }
            }
          }

          export async function resumeAllMusicFromGamePause() {
            if (!gamePauseMusicActive) return;
            gamePauseMusicActive = false;

            if (gamePauseWebAudioWasRunning && audioCtx?.state === 'suspended') {
              try { await audioCtx.resume(); } catch { /* ignore */ }
            }
            gamePauseWebAudioWasRunning = false;

            for (const [key, snapshot] of gamePauseMusicSnapshots.entries()) {
              const t = tracks[key];
              if (!t || !t.playing) continue;

              for (const el of snapshot.playingElements) {
                try { void el.play().catch(() => {}); } catch { /* ignore */ }
              }

              if (
                snapshot.fadeProgress !== null &&
                snapshot.active &&
                t.crossfadeSec > 0 &&
                snapshot.playingElements.length > 1
              ) {
                const incoming = snapshot.active;
                const outgoing = incoming === t.a ? t.b : t.a;
                const pStart = Math.max(0, Math.min(1, snapshot.fadeProgress));
                const startAt = performance.now();
                const tv = t.volume ?? VOL;
                t.active = incoming;

                t.fadeTimer = window.setInterval(() => {
                  const elapsed = (performance.now() - startAt) / 1000;
                  const p = Math.min(1, pStart + elapsed / t.crossfadeSec);
                  const outV = Math.cos((p * Math.PI) / 2) * tv;
                  const inV = Math.sin((p * Math.PI) / 2) * tv;

                  try { incoming.volume = Math.max(0, inV); } catch { /* ignore */ }
                  if (outgoing) {
                    try { outgoing.volume = Math.max(0, outV); } catch { /* ignore */ }
                  }

                  if (p >= 1) {
                    if (outgoing) {
                      try {
                        outgoing.pause();
                        outgoing.currentTime = 0;
                        outgoing.volume = 0;
                      } catch { /* ignore */ }
                    }
                    if (t.fadeTimer) {
                      clearInterval(t.fadeTimer);
                      t.fadeTimer = undefined;
                    }
                    watch(t);
                  }
                }, FADE_TICK_MS);
              } else {
                watch(t);
              }
            }

            gamePauseMusicSnapshots.clear();
          }

          """
          s = s.replace(stop_all, pause_music + stop_all, 1)
          p.write_text(s)

          # --- SFX: suspend Web Audio clock so active/scheduled effects freeze in place ---
          p = Path('src/components/game/sounds.ts')
          s = p.read_text()

          unlock = """export function unlockAudio() {
            const ctx = getCtx();
            if (ctx.state === 'suspended') ctx.resume().catch(() => {});
          }
          """
          if s.count(unlock) != 1:
              raise SystemExit(f'sounds unlockAudio: expected 1 match, found {s.count(unlock)}')

          sfx_pause = unlock + r"""

          let gamePauseSfxWasRunning = false;

          export async function pauseAllSfxForGamePause() {
            gamePauseSfxWasRunning = !!audioCtx && audioCtx.state === 'running';
            if (gamePauseSfxWasRunning && audioCtx) {
              try { await audioCtx.suspend(); } catch { /* ignore */ }
            }
          }

          export async function resumeAllSfxFromGamePause() {
            if (!gamePauseSfxWasRunning) return;
            gamePauseSfxWasRunning = false;
            if (audioCtx?.state === 'suspended') {
              try { await audioCtx.resume(); } catch { /* ignore */ }
            }
          }
          """
          s = s.replace(unlock, sfx_pause, 1)
          p.write_text(s)

          # --- Main game: tap canvas toggles true freeze + white circular II icon ---
          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          old_sound_import = "import { playJumpSound, playBarrelRollSound, playGameOverSound, playWinSound, playHitSound, playRobotKillSound, playKeyGrabSound, playWaterSproutSound, playGenieAppearSound, playPrincessSavedSound, playVineGrowSound, playDragonRoarTracked, playPrincessHelpSound, isDragonRoaringNow, unlockAudio } from './game/sounds';"
          new_sound_import = "import { playJumpSound, playBarrelRollSound, playGameOverSound, playWinSound, playHitSound, playRobotKillSound, playKeyGrabSound, playWaterSproutSound, playGenieAppearSound, playPrincessSavedSound, playVineGrowSound, playDragonRoarTracked, playPrincessHelpSound, isDragonRoaringNow, unlockAudio, pauseAllSfxForGamePause, resumeAllSfxFromGamePause } from './game/sounds';"
          if s.count(old_sound_import) != 1:
              raise SystemExit(f'game sounds import: expected 1 match, found {s.count(old_sound_import)}')
          s = s.replace(old_sound_import, new_sound_import, 1)

          old_music_import = "import { playLevel1Music, stopLevel1Music, playLevel2Music, stopLevel2Music, playLevel3Music, stopLevel3Music, playLevel4Music, stopLevel4Music, stopAllMusic } from './game/bgMusic';"
          new_music_import = "import { playLevel1Music, stopLevel1Music, playLevel2Music, stopLevel2Music, playLevel3Music, stopLevel3Music, playLevel4Music, stopLevel4Music, stopAllMusic, pauseAllMusicForGamePause, resumeAllMusicFromGamePause } from './game/bgMusic';"
          if s.count(old_music_import) != 1:
              raise SystemExit(f'game music import: expected 1 match, found {s.count(old_music_import)}')
          s = s.replace(old_music_import, new_music_import, 1)

          state_marker = "  const [gameState, setGameState] = useState<GameState>('intro');"
          state_replacement = """  const [gameState, setGameState] = useState<GameState>('intro');
            const [isPaused, setIsPaused] = useState(false);
            const pausedRef = useRef(false);"""
          if s.count(state_marker) != 1:
              raise SystemExit(f'pause state marker: expected 1 match, found {s.count(state_marker)}')
          s = s.replace(state_marker, state_replacement, 1)

          game_state_ref = """  const gameStateRef = useRef<GameState>('intro');
            useEffect(() => { gameStateRef.current = gameState; }, [gameState]);
          """
          toggle_block = game_state_ref + r"""

            const toggleGamePause = useCallback(() => {
              // Controller START must respond as soon as gameplay is active.
              // Do not wait for the opening caveman flash/invulnerability period.
              if (gameStateRef.current !== 'playing') return;

              const nextPaused = !pausedRef.current;
              pausedRef.current = nextPaused;
              setIsPaused(nextPaused);

              if (nextPaused) {
                void pauseAllMusicForGamePause();
                void pauseAllSfxForGamePause();
              } else {
                void resumeAllMusicFromGamePause();
                void resumeAllSfxFromGamePause();
              }
            }, []);

            // Native APK controller path. This hook is intentionally declared
            // after markGamepadActive and toggleGamePause to avoid a TDZ crash
            // during the first React render.
            useEffect(() => {
              const onNativeControllerKey = (event: Event) => {
                const detail = (event as CustomEvent<{ key?: string; down?: boolean }>).detail;
                const key = detail?.key;
                const down = Boolean(detail?.down);

                if (key === 'Start') {
                  markGamepadActive();
                  if (!down) return;

                  const gs = gameStateRef.current;
                  if (
                    gs === 'intro' ||
                    gs === 'attractLocalLeaderboard' ||
                    gs === 'attractGlobalLeaderboard' ||
                    gs === 'attractControls'
                  ) {
                    // START is equivalent to a normal immediate start action.
                    anyInputHandlerRef.current?.('Enter', 'keyboard');
                    return;
                  }

                  if (gs === 'playing') {
                    toggleGamePause();
                  }
                  return;
                }

                if (
                  key !== 'ArrowUp' &&
                  key !== 'ArrowDown' &&
                  key !== 'ArrowLeft' &&
                  key !== 'ArrowRight' &&
                  key !== ' '
                ) return;

                markGamepadActive();
                if (down) {
                  const wasAlreadyDown = keysRef.current.has(key);
                  keysRef.current.add(key);
                  if (!wasAlreadyDown) {
                    anyInputHandlerRef.current?.(key, 'pad');
                  }
                } else {
                  keysRef.current.delete(key);
                }
              };

              window.addEventListener('cvd-native-controller-key', onNativeControllerKey);
              return () => {
                window.removeEventListener('cvd-native-controller-key', onNativeControllerKey);
              };
            }, [markGamepadActive, toggleGamePause]);

            useEffect(() => {
              if (gameState === 'playing' || !pausedRef.current) return;
              pausedRef.current = false;
              setIsPaused(false);
              void resumeAllMusicFromGamePause();
              void resumeAllSfxFromGamePause();
            }, [gameState]);
          """
          if s.count(game_state_ref) != 1:
              raise SystemExit(f'gameStateRef marker: expected 1 match, found {s.count(game_state_ref)}')
          s = s.replace(game_state_ref, toggle_block, 1)

          loop_marker = """    const gameLoop = (timestamp: number) => {
                // Fixed-timestep gate: only run one full step+render per ~16.67ms.
          """
          loop_replacement = """    const gameLoop = (timestamp: number) => {
                if (pausedRef.current) {
                  lastTime = timestamp;
                  return;
                }

                // Fixed-timestep gate: only run one full step+render per ~16.67ms.
          """
          if s.count(loop_marker) != 1:
              raise SystemExit(f'game loop marker: expected 1 match, found {s.count(loop_marker)}')
          s = s.replace(loop_marker, loop_replacement, 1)

          canvas_marker = """          <canvas
                      ref={canvasRef}
                      width={CANVAS_W}
                      height={CANVAS_H}
                      className="block max-h-full max-w-full h-auto w-auto"
          """
          canvas_replacement = """          <canvas
                      ref={canvasRef}
                      width={CANVAS_W}
                      height={CANVAS_H}
                      onPointerDown={(e) => {
                        if (gameStateRef.current !== 'playing' || levelIntroRef.current) return;
                        e.preventDefault();
                        e.stopPropagation();
                        toggleGamePause();
                      }}
                      className="block max-h-full max-w-full h-auto w-auto"
          """
          if s.count(canvas_marker) != 1:
              raise SystemExit(f'canvas marker: expected 1 match, found {s.count(canvas_marker)}')
          s = s.replace(canvas_marker, canvas_replacement, 1)

          canvas_close = """            tabIndex={0}
                    />
                  </div>
          """
          pause_overlay = """            tabIndex={0}
                    />

                    {isPaused && gameState === 'playing' && (
                      <div
                        className="pointer-events-none absolute inset-0 z-30 flex items-center justify-center"
                        aria-hidden="true"
                      >
                        <div className="flex h-16 w-16 items-center justify-center rounded-full bg-white shadow-lg">
                          <div className="flex h-8 items-center gap-2">
                            <span className="block h-8 w-2 rounded-sm bg-black" />
                            <span className="block h-8 w-2 rounded-sm bg-black" />
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
          """
          if s.count(canvas_close) != 1:
              raise SystemExit(f'canvas close marker: expected 1 match, found {s.count(canvas_close)}')
          s = s.replace(canvas_close, pause_overlay, 1)

          p.write_text(s)

          bg = Path('src/components/game/bgMusic.ts').read_text()
          sf = Path('src/components/game/sounds.ts').read_text()
          gm = Path('src/components/CavemanVsDragonGame.tsx').read_text()

          required = {
              'BGM pause API': 'export async function pauseAllMusicForGamePause()' in bg,
              'BGM resume API': 'export async function resumeAllMusicFromGamePause()' in bg,
              'Crossfade preservation': 'fadeProgress = (2 / Math.PI) * Math.asin(ratio);' in bg,
              'SFX suspend': 'await audioCtx.suspend()' in sf,
              'SFX resume': 'await audioCtx.resume()' in sf,
              'Pause state': 'const [isPaused, setIsPaused] = useState(false);' in gm,
              'Simulation freeze': 'if (pausedRef.current)' in gm,
              'Canvas toggle': 'toggleGamePause();' in gm,
              'White round II icon': 'rounded-full bg-white' in gm and gm.count('rounded-sm bg-black') >= 2,
          }
          failed = [name for name, ok in required.items() if not ok]
          if failed:
              raise SystemExit(f'Pause assertion failed: {failed}')

          mark_idx = gm.find('const markGamepadActive')
          toggle_idx = gm.find('const toggleGamePause')
          native_listener_idx = gm.find("window.addEventListener('cvd-native-controller-key'")
          if not (0 <= mark_idx < toggle_idx < native_listener_idx):
              raise SystemExit(
                  f'Controller hook initialization order invalid: '
                  f'mark={mark_idx}, toggle={toggle_idx}, listener={native_listener_idx}'
              )

          print('True pause assertions passed')
          print('Controller hook order verified: callbacks initialize before native listener')
          PY

      - name: Patch Android layout and controller awareness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Native controller + iiRcade state. Use a single-line anchor so YAML
          # indentation cannot alter the source matcher.
          replace_once(
              "  const [gamepadActive, setGamepadActive] = useState<boolean>(false);",
              """  const [gamepadActive, setGamepadActive] = useState<boolean>(false);
          // Native Android fallback: detect attached controllers before the first
          // button press, and identify iiRcade hardware for its dedicated layout.
          const [nativeHardwareController, setNativeHardwareController] = useState<boolean>(false);
          const [isIiRcadeDevice, setIsIiRcadeDevice] = useState<boolean>(false);
          const [nativeTopCutoutInset, setNativeTopCutoutInset] = useState<number>(0);
          useEffect(() => {
            const pollNativeDevice = () => {
              try {
                const nativeBridge = (window as any).CvdNative;
                if (!nativeBridge) return;
                const iiRcade = Boolean(nativeBridge.isIiRcade?.());
                const controller = Boolean(nativeBridge.hasHardwareController?.());
                const cutoutInset = Number(nativeBridge.getTopCutoutInsetDp?.() ?? 0);
                setIsIiRcadeDevice(iiRcade);
                setNativeHardwareController(controller || iiRcade);
                setNativeTopCutoutInset(
                  Number.isFinite(cutoutInset) ? Math.max(0, Math.round(cutoutInset)) : 0
                );
              } catch {
                // Browser/non-native builds do not expose CvdNative.
              }
            };
            pollNativeDevice();
            const timer = window.setInterval(pollNativeDevice, 500);
            return () => window.clearInterval(timer);
          }, []);

          useEffect(() => {
            // If a native controller is disconnected, clear the sticky
            // gamepad-active flag once the Web Gamepad API also sees none.
            if (!isNativeApp || nativeHardwareController || isIiRcadeDevice) return;
            const pads = navigator.getGamepads?.() ?? [];
            const anyConnected = Array.from(pads).some((pad) => !!pad?.connected);
            if (!anyConnected && gamepadActiveRef.current) {
              gamepadActiveRef.current = false;
              setGamepadActive(false);
            }
          }, [nativeHardwareController, isIiRcadeDevice]);""",
              'gamepad state block'
          )

          replace_once(
              "  const controlsVisible = isTouchDevice && !(isNativeApp && isTablet) && !gamepadActive && !(gameState === 'intro' || gameState === 'attractLocalLeaderboard' || gameState === 'attractGlobalLeaderboard' || gameState === 'attractControls');",
              """  const controllerPresent = gamepadActive || nativeHardwareController || isIiRcadeDevice;
          const controlsVisible = isTouchDevice && !(isNativeApp && isTablet) && !controllerPresent && !(gameState === 'intro' || gameState === 'attractLocalLeaderboard' || gameState === 'attractGlobalLeaderboard' || gameState === 'attractControls');""",
              'controls visibility block'
          )

          # Landscape: equal-width control rails with a flexible centered game area.
          replace_once(
              'className="h-full shrink-0 py-2 pl-[calc(env(safe-area-inset-left)+0.5rem)] pr-2 touch-none flex items-center"',
              'className="h-full w-[min(28vw,180px)] shrink-0 py-2 pl-[calc(env(safe-area-inset-left)+0.5rem)] pr-2 touch-none flex items-center"',
              'landscape D-pad rail'
          )

          replace_once(
              'className="h-[min(80vh,260px)] w-[min(40vw,200px)]"',
              'className="h-[min(80vh,260px)] w-full"',
              'landscape D-pad size'
          )

          replace_once(
              'className="relative flex min-h-0 w-full flex-1 items-center justify-center bg-black"',
              'className="relative flex min-h-0 min-w-0 flex-1 items-center justify-center bg-black"',
              'center game area'
          )

          replace_once(
              'className="h-full shrink-0 py-2 pr-[calc(env(safe-area-inset-right)+0.5rem)] pl-2 touch-none flex flex-col items-stretch justify-center gap-2 w-[min(36vw,180px)]"',
              'className="h-full w-[min(28vw,180px)] shrink-0 py-2 pr-[calc(env(safe-area-inset-right)+0.5rem)] pl-2 touch-none flex flex-col items-stretch justify-center gap-2"',
              'landscape JUMP rail'
          )

          # Native container aspect ratio: iiRcade gets full 5:4.
          aspect_pattern = re.compile(
              r"aspectRatio:\s*isLandscape\s*\n"
              r"\s*\?\s*\(isTablet \? '4 / 3' : '16 / 9'\)\s*\n"
              r"\s*:\s*\(isTablet \? '3 / 4' : '9 / 16'\),"
          )
          aspect_replacement = """aspectRatio: isIiRcadeDevice
                    ? '5 / 4'
                    : isLandscape
                      ? (isTablet ? '4 / 3' : '16 / 9')
                      : (isTablet ? '3 / 4' : '9 / 16'),"""
          s, count = aspect_pattern.subn(aspect_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'native aspect-ratio block: expected 1 match, found {count}')

          # Canvas itself also fills the iiRcade 5:4 area.
          replace_once(
              'className="block max-h-full max-w-full h-auto w-auto"',
              'className="block max-h-full max-w-full"',
              'canvas class'
          )
          replace_once(
              'aspectRatio: `${CANVAS_W} / ${CANVAS_H}`,',
              "aspectRatio: isIiRcadeDevice ? '5 / 4' : `${CANVAS_W} / ${CANVAS_H}`,",
              'canvas aspect ratio'
          )

          canvas_width_pattern = re.compile(
              r"(aspectRatio:\s*isIiRcadeDevice\s*\?\s*'5 / 4'\s*:\s*`\$\{CANVAS_W\} / \$\{CANVAS_H\}`,\s*\n"
              r"\s*height:\s*'100%',\s*\n)\s*width:\s*'auto',"
          )
          s, count = canvas_width_pattern.subn(
              r"\1                      width: isIiRcadeDevice ? '100%' : 'auto',",
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(f'canvas width block: expected 1 match, found {count}')

          # Portrait camera cutout: move only the game screen downward by the
          # native display-cutout safe inset. The control bar is intentionally
          # untouched, and landscape/iiRcade layouts are unaffected.
          native_style_pattern = re.compile(
              r"maxHeight:\s*'100%',\s*\n"
              r"\s*maxWidth:\s*'100%',"
          )
          native_style_replacement = """maxHeight: '100%',
                  maxWidth: '100%',
                  transform: !isLandscape && nativeTopCutoutInset > 0
                    ? `translateY(${nativeTopCutoutInset}px)`
                    : undefined,"""
          s, count = native_style_pattern.subn(
              native_style_replacement,
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(
                  f'portrait camera-cutout game offset: expected 1 match, found {count}'
              )

          # APK haptics: prefer the native Android bridge because WebView's
          # navigator.vibrate() is not reliable on every device/WebView build.
          vibrate_pattern = re.compile(
              r"  const vibrateNow = \(ms: number\) => \{\n"
              r"    try \{\n"
              r".*?"
              r"    \} catch \{\}\n"
              r"  \};",
              re.DOTALL,
          )
          vibrate_replacement = """  const vibrateNow = (ms: number) => {
            const duration = Math.max(18, Math.round(ms));
            try {
              const nativeBridge = (window as any).CvdNative;
              if (nativeBridge && typeof nativeBridge.vibrate === 'function') {
                nativeBridge.vibrate(duration);
                return;
              }
            } catch {}
            try {
              const nav = typeof navigator !== 'undefined'
                ? (navigator as Navigator & { vibrate?: (p: number | number[]) => boolean })
                : null;
              if (!nav || typeof nav.vibrate !== 'function') return;
              nav.vibrate(0);
              nav.vibrate(duration);
            } catch {}
          };"""
          s, count = vibrate_pattern.subn(vibrate_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'vibrateNow block: expected 1 match, found {count}')

          # Portrait native controls: center the 152px control row vertically
          # in the space below the game instead of letting it touch the phone bottom.
          replace_once(
              'className={`w-full shrink-0 overflow-hidden px-2 pt-2 touch-none ${isNativeApp ? \'pb-0 -mt-2\' : \'pb-[calc(env(safe-area-inset-bottom)+0.5rem)]\'}`}',
              'className={`w-full shrink-0 overflow-hidden px-2 touch-none ${isNativeApp ? \'py-[clamp(24px,4vh,48px)]\' : \'pt-2 pb-[calc(env(safe-area-inset-bottom)+0.5rem)]\'}`}',
              'portrait control centering'
          )

          p.write_text(s)
          print('Android layout/controller/native-haptics/portrait-centering/cutout-offset patch applied successfully')
          PY

      - name: Disable duplicate Web Gamepad path in native APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          old = (
              "  // ============= Gamepad API polling (PC + browsers that expose it) =============\n"
              "  // Standard mapping: 0=A (jump), 9=Start (R), 12/13/14/15 = DPAD up/down/left/right.\n"
              "  // Left stick: axes[0] (x), axes[1] (y). Threshold 0.4.\n"
              "  useEffect(() => {\n"
              "    let raf = 0;"
          )
          new = (
              "  // ============= Gamepad API polling (PC + browsers that expose it) =============\n"
              "  // Native APK controller input is handled by MainActivity instead, preventing\n"
              "  // duplicate native + Web Gamepad delivery from fighting over held state.\n"
              "  // Browser/PC keeps the existing standard Gamepad API path.\n"
              "  useEffect(() => {\n"
              "    if (isNativeApp) return;\n"
              "    let raf = 0;"
          )

          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Native Gamepad bypass: expected 1 match, found {count}')
          s = s.replace(old, new, 1)
          p.write_text(s)

          gm = p.read_text()
          mark_idx = gm.find('const markGamepadActive')
          toggle_idx = gm.find('const toggleGamePause')
          listener_idx = gm.find("window.addEventListener('cvd-native-controller-key'")
          if not (0 <= mark_idx < toggle_idx < listener_idx):
              raise SystemExit(
                  f'Runtime hook order invalid: mark={mark_idx}, '
                  f'toggle={toggle_idx}, listener={listener_idx}'
              )
          if 'if (isNativeApp) return;' not in gm:
              raise SystemExit('Native Gamepad bypass assertion failed')

          print('Native controller runtime ordering and duplicate-path bypass verified')
          PY

