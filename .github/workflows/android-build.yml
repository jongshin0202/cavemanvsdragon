      - name: Add native Android D-pad analog A START controller bridge
        shell: bash
        run: |
          MAIN='android/app/src/main/java/com/team2go/cavemanvsdragon/MainActivity.java'
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'JAVA'
          package com.team2go.cavemanvsdragon;

          import android.content.Context;
          import android.graphics.Point;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.os.VibratorManager;
          import android.view.InputDevice;
          import android.view.KeyCharacterMap;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import java.util.Locale;

          public class MainActivity extends BridgeActivity {

              private boolean iiRcadeDevice = false;

              // External-controller state. D-pad key events and motion axes
              // are tracked separately, then merged into one effective held
              // state so one source cannot incorrectly release the other.
              private boolean keyDpadUp = false;
              private boolean keyDpadDown = false;
              private boolean keyDpadLeft = false;
              private boolean keyDpadRight = false;

              private boolean motionUp = false;
              private boolean motionDown = false;
              private boolean motionLeft = false;
              private boolean motionRight = false;

              private boolean effectiveUp = false;
              private boolean effectiveDown = false;
              private boolean effectiveLeft = false;
              private boolean effectiveRight = false;

              private boolean controllerA = false;
              private boolean controllerStart = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enterImmersiveMode();
                  iiRcadeDevice = detectIiRcadeDevice();

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      final WebView webView = getBridge().getWebView();

                      // Packaged APK assets must always come from this installed build,
                      // never from a stale WebView HTTP/resource cache left by an
                      // earlier test APK.
                      webView.clearCache(true);
                      webView.clearHistory();
                      webView.getSettings().setCacheMode(android.webkit.WebSettings.LOAD_NO_CACHE);

                      webView.setFocusable(true);
                      webView.setFocusableInTouchMode(true);
                      webView.requestFocus();
                      webView.addJavascriptInterface(
                          new CvdDeviceBridge(),
                          "CvdNative"
                      );
                      // Android exposes newly added JavaScript interfaces only
                      // after the page is reloaded. Reload once so the React app
                      // can query controller/iiRcade state from startup onward.
                      webView.reload();
                  }
              }

              @Override
              public void onPause() {
                  if (getBridge() != null && getBridge().getWebView() != null) {
                      final WebView webView = getBridge().getWebView();

                      webView.evaluateJavascript(
                          "window.dispatchEvent(new Event('cvd-native-app-background'));",
                          null
                      );
                      webView.onPause();
                  }

                  super.onPause();
              }

              @Override
              public void onResume() {
                  super.onResume();

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      getBridge().getWebView().onResume();
                  }

                  enterImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enterImmersiveMode();
              }

              private void enterImmersiveMode() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      final WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          View.SYSTEM_UI_FLAG_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }

              private boolean detectIiRcadeDevice() {
                  final String identity = (
                      Build.MANUFACTURER + " " +
                      Build.BRAND + " " +
                      Build.MODEL + " " +
                      Build.PRODUCT + " " +
                      Build.DEVICE + " " +
                      Build.HARDWARE + " " +
                      Build.BOARD + " " +
                      Build.DISPLAY + " " +
                      Build.FINGERPRINT
                  ).toLowerCase(Locale.US);

                  if (identity.contains("iircade") ||
                      identity.contains("iroro1") ||
                      identity.contains("iroro2") ||
                      identity.contains("iror01") ||
                      identity.contains("iror02")) {
                      return true;
                  }

                  // Fallback for production iiRcade hardware whose Android
                  // build strings do not expose the brand/model explicitly.
                  // Classic and Gold units use RK3399-class hardware with a
                  // 1280x1024 (5:4) cabinet display.
                  final boolean rk3399 =
                      identity.contains("rk3399") ||
                      identity.contains("rockchip");

                  try {
                      final Point size = new Point();
                      getWindowManager().getDefaultDisplay().getRealSize(size);
                      final int longSide = Math.max(size.x, size.y);
                      final int shortSide = Math.min(size.x, size.y);
                      final boolean cabinetResolution =
                          longSide == 1280 && shortSide == 1024;
                      return rk3399 && cabinetResolution;
                  } catch (Throwable ignored) {
                      return false;
                  }
              }

              private int readTopCutoutInsetDp() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) return 0;
                  try {
                      final WindowInsets insets =
                          getWindow().getDecorView().getRootWindowInsets();
                      if (insets == null) return 0;

                      int insetPx = 0;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          insetPx = insets
                              .getInsetsIgnoringVisibility(WindowInsets.Type.displayCutout())
                              .top;
                      }

                      if (insets.getDisplayCutout() != null) {
                          insetPx = Math.max(
                              insetPx,
                              insets.getDisplayCutout().getSafeInsetTop()
                          );
                      }

                      if (insetPx <= 0) return 0;
                      final float density =
                          Math.max(1.0f, getResources().getDisplayMetrics().density);
                      // Add a tiny visual cushion below the physical cutout.
                      return Math.max(0, Math.round(insetPx / density) + 4);
                  } catch (Throwable ignored) {
                      return 0;
                  }
              }

              private void vibratePhone(int requestedMs) {
                  final int durationMs = Math.max(18, Math.min(requestedMs, 120));
                  try {
                      final Vibrator vibrator;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          final VibratorManager manager =
                              (VibratorManager) getSystemService(Context.VIBRATOR_MANAGER_SERVICE);
                          vibrator = manager != null ? manager.getDefaultVibrator() : null;
                      } else {
                          vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      }

                      if (vibrator == null || !vibrator.hasVibrator()) return;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(
                              VibrationEffect.createOneShot(
                                  durationMs,
                                  VibrationEffect.DEFAULT_AMPLITUDE
                              )
                          );
                      } else {
                          vibrator.vibrate(durationMs);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private boolean hasHardwareGameController() {
                  // Some USB/Bluetooth controllers report keyboard-style source
                  // flags even though they emit Android gamepad button keycodes.
                  // KEYCODE_BUTTON_A / START capability is therefore authoritative
                  // for the controller used by this game.
                  if (
                      KeyCharacterMap.deviceHasKey(KeyEvent.KEYCODE_BUTTON_A) ||
                      KeyCharacterMap.deviceHasKey(KeyEvent.KEYCODE_BUTTON_START)
                  ) {
                      return true;
                  }

                  // Keep the standard Android source-based detection as fallback.
                  final int[] ids = InputDevice.getDeviceIds();
                  for (int id : ids) {
                      final InputDevice device = InputDevice.getDevice(id);
                      if (device == null || device.isVirtual()) continue;

                      final int sources = device.getSources();
                      final boolean gamepad =
                          (sources & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD;
                      final boolean joystick =
                          (sources & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK;
                      final boolean dpadController =
                          (sources & InputDevice.SOURCE_DPAD) == InputDevice.SOURCE_DPAD &&
                          device.getKeyboardType() != InputDevice.KEYBOARD_TYPE_ALPHABETIC;

                      if (gamepad || joystick || dpadController) return true;
                  }
                  return false;
              }

              private final class CvdDeviceBridge {
                  @JavascriptInterface
                  public boolean isIiRcade() {
                      return iiRcadeDevice;
                  }

                  @JavascriptInterface
                  public boolean hasGameController() {
                      return hasHardwareGameController();
                  }

                  @JavascriptInterface
                  public boolean hasHardwareController() {
                      return hasHardwareGameController() || iiRcadeDevice;
                  }

                  @JavascriptInterface
                  public int getTopCutoutInsetDp() {
                      return readTopCutoutInsetDp();
                  }

                  @JavascriptInterface
                  public void vibrate(int durationMs) {
                      vibratePhone(durationMs);
                  }
              }

              private static String gameKeyForAndroidKeyCode(int keyCode) {
                  switch (keyCode) {
                      case KeyEvent.KEYCODE_DPAD_UP:    // 19
                          return "ArrowUp";
                      case KeyEvent.KEYCODE_DPAD_DOWN:  // 20
                          return "ArrowDown";
                      case KeyEvent.KEYCODE_DPAD_LEFT:  // 21
                          return "ArrowLeft";
                      case KeyEvent.KEYCODE_DPAD_RIGHT: // 22
                          return "ArrowRight";
                      case KeyEvent.KEYCODE_BUTTON_A:   // 96
                          return " ";
                      case KeyEvent.KEYCODE_BUTTON_START: // 108
                          return "Start";
                      default:
                          return null;
                  }
              }

              private boolean isControllerInputSource(int source) {
                  final boolean gamepad =
                      (source & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD;
                  final boolean joystick =
                      (source & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK;
                  final boolean dpad =
                      (source & InputDevice.SOURCE_DPAD) == InputDevice.SOURCE_DPAD;
                  return gamepad || joystick || dpad;
              }

              private void setEffectiveDirection(String key, boolean down) {
                  boolean current;
                  switch (key) {
                      case "ArrowUp":    current = effectiveUp; break;
                      case "ArrowDown":  current = effectiveDown; break;
                      case "ArrowLeft":  current = effectiveLeft; break;
                      case "ArrowRight": current = effectiveRight; break;
                      default: return;
                  }
                  if (current == down) return;

                  switch (key) {
                      case "ArrowUp":    effectiveUp = down; break;
                      case "ArrowDown":  effectiveDown = down; break;
                      case "ArrowLeft":  effectiveLeft = down; break;
                      case "ArrowRight": effectiveRight = down; break;
                  }
                  dispatchControllerStateToGame(key, down);
              }

              private void refreshEffectiveDirections() {
                  setEffectiveDirection("ArrowUp",    keyDpadUp    || motionUp);
                  setEffectiveDirection("ArrowDown",  keyDpadDown  || motionDown);
                  setEffectiveDirection("ArrowLeft",  keyDpadLeft  || motionLeft);
                  setEffectiveDirection("ArrowRight", keyDpadRight || motionRight);
              }

              private void setDigitalDpadState(String key, boolean down) {
                  switch (key) {
                      case "ArrowUp":    keyDpadUp = down; break;
                      case "ArrowDown":  keyDpadDown = down; break;
                      case "ArrowLeft":  keyDpadLeft = down; break;
                      case "ArrowRight": keyDpadRight = down; break;
                      default: return;
                  }
                  refreshEffectiveDirections();
              }

              private void setButtonState(String key, boolean down) {
                  if (" ".equals(key)) {
                      if (controllerA == down) return;
                      controllerA = down;
                      dispatchControllerStateToGame(" ", down);
                      return;
                  }

                  if ("Start".equals(key)) {
                      if (controllerStart == down) return;
                      controllerStart = down;
                      dispatchControllerStateToGame("Start", down);
                  }
              }

              private boolean isUnsupportedControllerButton(int keyCode) {
                  switch (keyCode) {
                      case KeyEvent.KEYCODE_BUTTON_B:
                      case KeyEvent.KEYCODE_BUTTON_C:
                      case KeyEvent.KEYCODE_BUTTON_X:
                      case KeyEvent.KEYCODE_BUTTON_Y:
                      case KeyEvent.KEYCODE_BUTTON_Z:
                      case KeyEvent.KEYCODE_BUTTON_L1:
                      case KeyEvent.KEYCODE_BUTTON_R1:
                      case KeyEvent.KEYCODE_BUTTON_L2:
                      case KeyEvent.KEYCODE_BUTTON_R2:
                      case KeyEvent.KEYCODE_BUTTON_THUMBL:
                      case KeyEvent.KEYCODE_BUTTON_THUMBR:
                      case KeyEvent.KEYCODE_BUTTON_SELECT:
                      case KeyEvent.KEYCODE_BUTTON_MODE:
                          return true;
                      default:
                          return false;
                  }
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  final int keyCode = event.getKeyCode();
                  final String gameKey = gameKeyForAndroidKeyCode(keyCode);

                  if (gameKey != null) {
                      final boolean down = event.getAction() == KeyEvent.ACTION_DOWN;
                      final boolean up = event.getAction() == KeyEvent.ACTION_UP;
                      if (!down && !up) return true;

                      if (
                          "ArrowUp".equals(gameKey) ||
                          "ArrowDown".equals(gameKey) ||
                          "ArrowLeft".equals(gameKey) ||
                          "ArrowRight".equals(gameKey)
                      ) {
                          setDigitalDpadState(gameKey, down);
                      } else {
                          setButtonState(gameKey, down);
                      }
                      return true;
                  }

                  // Unsupported controller buttons must never escape to Android/
                  // WebView default handling. Some controllers expose B as
                  // BACK/ESCAPE rather than KEYCODE_BUTTON_B.
                  if (isUnsupportedControllerButton(keyCode)) {
                      return true;
                  }

                  if (
                      hasHardwareGameController() &&
                      (
                          keyCode == KeyEvent.KEYCODE_BACK ||
                          keyCode == KeyEvent.KEYCODE_ESCAPE
                      )
                  ) {
                      return true;
                  }

                  return super.dispatchKeyEvent(event);
              }

              @Override
              public boolean dispatchGenericMotionEvent(MotionEvent event) {
                  if (
                      event.getAction() == MotionEvent.ACTION_MOVE &&
                      isControllerInputSource(event.getSource())
                  ) {
                      final boolean hadMotionDirection =
                          motionUp || motionDown || motionLeft || motionRight;

                      final float hatX = event.getAxisValue(MotionEvent.AXIS_HAT_X);
                      final float hatY = event.getAxisValue(MotionEvent.AXIS_HAT_Y);
                      final float stickX = event.getAxisValue(MotionEvent.AXIS_X);
                      final float stickY = event.getAxisValue(MotionEvent.AXIS_Y);

                      final float hatThreshold = 0.5f;
                      final float stickThreshold = 0.42f;

                      final float x =
                          Math.abs(hatX) >= hatThreshold ? hatX : stickX;
                      final float y =
                          Math.abs(hatY) >= hatThreshold ? hatY : stickY;

                      motionLeft  = x < -stickThreshold;
                      motionRight = x >  stickThreshold;
                      motionUp    = y < -stickThreshold;
                      motionDown  = y >  stickThreshold;

                      refreshEffectiveDirections();

                      if (
                          Math.abs(hatX) > 0.01f ||
                          Math.abs(hatY) > 0.01f ||
                          Math.abs(stickX) > 0.01f ||
                          Math.abs(stickY) > 0.01f ||
                          hadMotionDirection ||
                          motionUp || motionDown || motionLeft || motionRight
                      ) {
                          return true;
                      }
                  }

                  return super.dispatchGenericMotionEvent(event);
              }

              private void dispatchControllerStateToGame(String key, boolean down) {
                  if (getBridge() == null) return;
                  final WebView webView = getBridge().getWebView();
                  if (webView == null) return;

                  final String js =
                      "(function(){" +
                      "window.dispatchEvent(new CustomEvent('cvd-native-controller-key',{" +
                      "detail:{key:" + jsString(key) + ",down:" + down + "}" +
                      "}));" +
                      "})();";

                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              private static String jsString(String value) {
                  if (value == null) return "''";
                  return "'" + value
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                      .replace("\r", "\\r")
                      .replace("\n", "\\n") + "'";
              }
          }
          JAVA

