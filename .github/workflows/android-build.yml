name: Build Caveman Vs Dragon Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - AndroidAPK-MusicEnhance
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout game source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Configure self-contained Android app
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.team2go.cavemanvsdragon.stereoall',
            appName: 'CVD Stereo All',
            webDir: 'dist',
            android: {
              allowMixedContent: false,
            },
          };

          export default config;
          EOF

      - name: Bundle game music
        shell: bash
        run: |
          BASE='https://8ca556b9-b5b4-4910-80b1-d14db143f4d8.lovableproject.com'

          mkdir -p public/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1
          mkdir -p public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57
          mkdir -p public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747
          mkdir -p public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89
          mkdir -p public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1/Gamemusic1.mp3" \
            -o public/__l5e/assets-v1/81d122e4-f5a6-4c74-b218-ad496945acb1/Gamemusic1.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3" \
            -o public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3" \
            -o public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3" \
            -o public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3

          curl -fL --retry 3 \
            "$BASE/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3" \
            -o public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3

      - name: Master Level 2+ music for phone speakers
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          L2='public/__l5e/assets-v1/07c06cb2-2107-41a3-9990-f3212851fe57/Gamemusic2.mp3'
          L3='public/__l5e/assets-v1/685f4432-28cf-481b-ad6f-40d5388eb747/Gamemusic3.mp3'
          L4='public/__l5e/assets-v1/a6f66d24-ca19-4677-97af-60cd2eda8a89/Gamemusic4.mp3'
          ENDING='public/__l5e/assets-v1/9f6d1fe7-96b1-4f22-ac2d-43ddf020559c/Gamemusic_Ending.mp3'

          # Level 2: preserve composition, widen the tiny existing stereo side,
          # add phone-relevant presence, compress/limit for much stronger
          # perceived loudness, and retain ~0.4 dB true-peak headroom.
          ffmpeg -y -loglevel error -i "$L2" \
            -af "highpass=f=70,stereotools=slev=4,equalizer=f=1200:t=q:w=1:g=2,acompressor=threshold=0.12:ratio=3:attack=5:release=80:makeup=2.0,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L2%.mp3}.mastered.mp3"
          mv "${L2%.mp3}.mastered.mp3" "$L2"

          # Level 3 is bass-heavier than Level 1, so shift more energy into
          # the low-mid/presence range that phone speakers reproduce well.
          ffmpeg -y -loglevel error -i "$L3" \
            -af "highpass=f=80,stereotools=slev=4,equalizer=f=500:t=q:w=1:g=2,equalizer=f=1400:t=q:w=1:g=3,acompressor=threshold=0.12:ratio=3:attack=5:release=80:makeup=2.2,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L3%.mp3}.mastered.mp3"
          mv "${L3%.mp3}.mastered.mp3" "$L3"

          # Level 4 already has healthy stereo width, so do not widen it.
          # Only improve presence and perceived loudness.
          ffmpeg -y -loglevel error -i "$L4" \
            -af "highpass=f=60,equalizer=f=1000:t=q:w=1:g=1,acompressor=threshold=0.14:ratio=2.5:attack=5:release=80:makeup=1.7,alimiter=limit=0.58:attack=5:release=50,volume=-1.3dB" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${L4%.mp3}.mastered.mp3"
          mv "${L4%.mp3}.mastered.mp3" "$L4"

          # Ending: modest mastering only; no stereo-width manipulation.
          ffmpeg -y -loglevel error -i "$ENDING" \
            -af "highpass=f=60,acompressor=threshold=0.14:ratio=2.5:attack=5:release=80:makeup=1.5,alimiter=limit=0.65:attack=5:release=50:level=false" \
            -ar 44100 -ac 2 -c:a libmp3lame -b:a 192k "${ENDING%.mp3}.mastered.mp3"
          mv "${ENDING%.mp3}.mastered.mp3" "$ENDING"

          # Sanity check every mastered asset before the web build.
          for f in "$L2" "$L3" "$L4" "$ENDING"; do
            test -s "$f"
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name,sample_rate,channels \
              -of default=nw=1 "$f"
          done

          echo 'Level 2+ phone-speaker mastering completed successfully'

      - name: Set later-level music to full in-game volume
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/game/bgMusic.ts')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Add per-track playback volume. Level 1 remains exactly as before
          # at 0.333. Levels 2-4 and ending play at full HTML/WebAudio volume.
          replace_once(
              "  crossfadeSec: number;\n};",
              "  crossfadeSec: number;\n  volume?: number;\n};",
              'Track volume field'
          )

          replace_once(
              "  level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC },",
              "  level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: VOL },",
              'Level 1 volume'
          )
          replace_once(
              "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2 },",
              "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 1.0 },",
              'Level 2 volume'
          )
          replace_once(
              "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3 },",
              "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 1.0 },",
              'Level 3 volume'
          )
          replace_once(
              "  level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC },",
              "  level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 1.0 },",
              'Level 4 volume'
          )
          replace_once(
              "  ending: { url: musicEndingAsset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC },",
              "  ending: { url: musicEndingAsset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 1.0 },",
              'Ending volume'
          )

          # Use per-track volume in both playback engines.
          replace_once(
              "  gain.gain.value = VOL;",
              "  gain.gain.value = t.volume ?? VOL;",
              'WebAudio gain'
          )
          replace_once(
              "    const outV = Math.cos((p * Math.PI) / 2) * VOL;\n    const inV = Math.sin((p * Math.PI) / 2) * VOL;",
              "    const tv = t.volume ?? VOL;\n    const outV = Math.cos((p * Math.PI) / 2) * tv;\n    const inV = Math.sin((p * Math.PI) / 2) * tv;",
              'Crossfade volume'
          )
          replace_once(
              "  try { t.a.pause(); t.a.currentTime = 0; t.a.volume = VOL; } catch { /* ignore */ }",
              "  try { t.a.pause(); t.a.currentTime = 0; t.a.volume = t.volume ?? VOL; } catch { /* ignore */ }",
              'HTMLAudio start volume'
          )

          p.write_text(s)

          required = [
              "level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: VOL }",
              "level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 1.0 }",
              "level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 1.0 }",
              "level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 1.0 }",
              "gain.gain.value = t.volume ?? VOL;",
              "t.a.volume = t.volume ?? VOL;",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Full-volume assertion failed: {missing}')

          print('Level 1 playback volume: 0.333')
          print('Levels 2-4 playback volume: 1.0')
          print('Ending playback volume: 1.0')
          PY

      - name: Route all BGM through HTMLAudio stereo paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/game/bgMusic.ts')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Level 1, Level 4 and Ending already use the HTMLAudio crossfade
          # path because their crossfadeSec is > 0.
          #
          # Level 2 and Level 3 are the only tracks that normally enter the
          # Web Audio AudioBufferSourceNode path. Mark those two for an
          # explicit HTMLAudioElement native-loop route instead.
          replace_once(
              "  volume?: number;\n};",
              "  volume?: number;\n  htmlNativeLoop?: boolean;\n};",
              'HTML native-loop field'
          )

          replace_once(
              "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 1.0 },",
              "  level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 1.0, htmlNativeLoop: true },",
              'Level 2 HTMLAudio route'
          )

          replace_once(
              "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 1.0 },",
              "  level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 1.0, htmlNativeLoop: true },",
              'Level 3 HTMLAudio route'
          )

          # Insert the HTMLAudio native-loop route immediately before the
          # existing Web Audio branch. Match only the branch line itself so
          # whitespace/comments cannot break the workflow matcher.
          needle = "  if (t.crossfadeSec <= 0) {"
          if s.count(needle) != 1:
              raise SystemExit(
                  f'WebAudio play branch: expected 1 match, found {s.count(needle)}'
              )

          html_loop_block = """  if (t.htmlNativeLoop) {
            // Android stereo-preserving route for Level 2/3.
            // Use ordinary HTML media playback, same playback family as
            // Level 1/4/Ending, instead of AudioBufferSourceNode.
            stopWebAudio(t);
            clearTimers(t);
            if (!t.a) t.a = makeAudio(t.url);
            try {
              t.a.pause();
              t.a.currentTime = 0;
              t.a.loop = true;
              t.a.volume = t.volume ?? VOL;
              t.active = t.a;
              void t.a.play().catch(() => {});
            } catch { /* ignore */ }
            return;
          }

          """

          s = s.replace(needle, html_loop_block + needle, 1)

          p.write_text(s)

          # Explicitly prove that every Android BGM track resolves to an
          # HTMLAudio route:
          #   L1       crossfade HTMLAudio
          #   L2       native-loop HTMLAudio
          #   L3       native-loop HTMLAudio
          #   L4       crossfade HTMLAudio
          #   Ending   crossfade HTMLAudio
          required = {
              'Level 1 HTMLAudio crossfade':
                  "level1: { url: music1Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: VOL }",
              'Level 2 HTMLAudio native loop':
                  "level2: { url: music2Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level2, volume: 1.0, htmlNativeLoop: true }",
              'Level 3 HTMLAudio native loop':
                  "level3: { url: music3Asset.url, playing: false, crossfadeSec: CROSSFADE_OVERRIDES.level3, volume: 1.0, htmlNativeLoop: true }",
              'Level 4 HTMLAudio crossfade':
                  "level4: { url: music4Asset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 1.0 }",
              'Ending HTMLAudio crossfade':
                  "ending: { url: musicEndingAsset.url, playing: false, crossfadeSec: DEFAULT_CROSSFADE_SEC, volume: 1.0 }",
              'Native HTMLAudio loop implementation':
                  "t.a.loop = true;",
          }

          missing = [label for label, fragment in required.items() if fragment not in s]
          if missing:
              raise SystemExit(f'All-stereo routing assertion failed: {missing}')

          # No defined BGM track is allowed to reach WebAudio:
          # only zero-crossfade tracks can enter that branch, and both
          # zero-crossfade tracks are now intercepted by htmlNativeLoop.
          if "level2: 0" not in s or "level3: 0" not in s:
              raise SystemExit('Unexpected crossfade override configuration')

          print('Android BGM route verification:')
          print('  Level 1  -> HTMLAudio crossfade @ 0.333')
          print('  Level 2  -> HTMLAudio native loop @ 1.0')
          print('  Level 3  -> HTMLAudio native loop @ 1.0')
          print('  Level 4  -> HTMLAudio crossfade @ 1.0')
          print('  Ending   -> HTMLAudio crossfade @ 1.0')
          print('  WebAudio -> unreachable by all five BGM tracks')
          PY

      - name: Patch Android layout and controller awareness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/CavemanVsDragonGame.tsx')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          # Native controller + iiRcade state. Use a single-line anchor so YAML
          # indentation cannot alter the source matcher.
          replace_once(
              "  const [gamepadActive, setGamepadActive] = useState<boolean>(false);",
              """  const [gamepadActive, setGamepadActive] = useState<boolean>(false);
          // Native Android fallback: detect attached controllers before the first
          // button press, and identify iiRcade hardware for its dedicated layout.
          const [nativeHardwareController, setNativeHardwareController] = useState<boolean>(false);
          const [isIiRcadeDevice, setIsIiRcadeDevice] = useState<boolean>(false);
          const [nativeTopCutoutInset, setNativeTopCutoutInset] = useState<number>(0);
          useEffect(() => {
            const pollNativeDevice = () => {
              try {
                const nativeBridge = (window as any).CvdNative;
                if (!nativeBridge) return;
                const iiRcade = Boolean(nativeBridge.isIiRcade?.());
                const controller = Boolean(nativeBridge.hasHardwareController?.());
                const cutoutInset = Number(nativeBridge.getTopCutoutInsetDp?.() ?? 0);
                setIsIiRcadeDevice(iiRcade);
                setNativeHardwareController(controller || iiRcade);
                setNativeTopCutoutInset(
                  Number.isFinite(cutoutInset) ? Math.max(0, Math.round(cutoutInset)) : 0
                );
              } catch {
                // Browser/non-native builds do not expose CvdNative.
              }
            };
            pollNativeDevice();
            const timer = window.setInterval(pollNativeDevice, 500);
            return () => window.clearInterval(timer);
          }, []);

          useEffect(() => {
            // If a native controller is disconnected, clear the sticky
            // gamepad-active flag once the Web Gamepad API also sees none.
            if (!isNativeApp || nativeHardwareController || isIiRcadeDevice) return;
            const pads = navigator.getGamepads?.() ?? [];
            const anyConnected = Array.from(pads).some((pad) => !!pad?.connected);
            if (!anyConnected && gamepadActiveRef.current) {
              gamepadActiveRef.current = false;
              setGamepadActive(false);
            }
          }, [nativeHardwareController, isIiRcadeDevice]);""",
              'gamepad state block'
          )

          replace_once(
              "  const controlsVisible = isTouchDevice && !(isNativeApp && isTablet) && !gamepadActive && !(gameState === 'intro' || gameState === 'attractLocalLeaderboard' || gameState === 'attractGlobalLeaderboard' || gameState === 'attractControls');",
              """  const controllerPresent = gamepadActive || nativeHardwareController || isIiRcadeDevice;
          const controlsVisible = isTouchDevice && !(isNativeApp && isTablet) && !controllerPresent && !(gameState === 'intro' || gameState === 'attractLocalLeaderboard' || gameState === 'attractGlobalLeaderboard' || gameState === 'attractControls');""",
              'controls visibility block'
          )

          # Landscape: equal-width control rails with a flexible centered game area.
          replace_once(
              'className="h-full shrink-0 py-2 pl-[calc(env(safe-area-inset-left)+0.5rem)] pr-2 touch-none flex items-center"',
              'className="h-full w-[min(28vw,180px)] shrink-0 py-2 pl-[calc(env(safe-area-inset-left)+0.5rem)] pr-2 touch-none flex items-center"',
              'landscape D-pad rail'
          )

          replace_once(
              'className="h-[min(80vh,260px)] w-[min(40vw,200px)]"',
              'className="h-[min(80vh,260px)] w-full"',
              'landscape D-pad size'
          )

          replace_once(
              'className="relative flex min-h-0 w-full flex-1 items-center justify-center bg-black"',
              'className="relative flex min-h-0 min-w-0 flex-1 items-center justify-center bg-black"',
              'center game area'
          )

          replace_once(
              'className="h-full shrink-0 py-2 pr-[calc(env(safe-area-inset-right)+0.5rem)] pl-2 touch-none flex flex-col items-stretch justify-center gap-2 w-[min(36vw,180px)]"',
              'className="h-full w-[min(28vw,180px)] shrink-0 py-2 pr-[calc(env(safe-area-inset-right)+0.5rem)] pl-2 touch-none flex flex-col items-stretch justify-center gap-2"',
              'landscape JUMP rail'
          )

          # Native container aspect ratio: iiRcade gets full 5:4.
          aspect_pattern = re.compile(
              r"aspectRatio:\s*isLandscape\s*\n"
              r"\s*\?\s*\(isTablet \? '4 / 3' : '16 / 9'\)\s*\n"
              r"\s*:\s*\(isTablet \? '3 / 4' : '9 / 16'\),"
          )
          aspect_replacement = """aspectRatio: isIiRcadeDevice
                    ? '5 / 4'
                    : isLandscape
                      ? (isTablet ? '4 / 3' : '16 / 9')
                      : (isTablet ? '3 / 4' : '9 / 16'),"""
          s, count = aspect_pattern.subn(aspect_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'native aspect-ratio block: expected 1 match, found {count}')

          # Canvas itself also fills the iiRcade 5:4 area.
          replace_once(
              'className="block max-h-full max-w-full h-auto w-auto"',
              'className="block max-h-full max-w-full"',
              'canvas class'
          )
          replace_once(
              'aspectRatio: `${CANVAS_W} / ${CANVAS_H}`,',
              "aspectRatio: isIiRcadeDevice ? '5 / 4' : `${CANVAS_W} / ${CANVAS_H}`,",
              'canvas aspect ratio'
          )

          canvas_width_pattern = re.compile(
              r"(aspectRatio:\s*isIiRcadeDevice\s*\?\s*'5 / 4'\s*:\s*`\$\{CANVAS_W\} / \$\{CANVAS_H\}`,\s*\n"
              r"\s*height:\s*'100%',\s*\n)\s*width:\s*'auto',"
          )
          s, count = canvas_width_pattern.subn(
              r"\1                      width: isIiRcadeDevice ? '100%' : 'auto',",
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(f'canvas width block: expected 1 match, found {count}')

          # Portrait camera cutout: move only the game screen downward by the
          # native display-cutout safe inset. The control bar is intentionally
          # untouched, and landscape/iiRcade layouts are unaffected.
          native_style_pattern = re.compile(
              r"maxHeight:\s*'100%',\s*\n"
              r"\s*maxWidth:\s*'100%',"
          )
          native_style_replacement = """maxHeight: '100%',
                  maxWidth: '100%',
                  transform: !isLandscape && nativeTopCutoutInset > 0
                    ? `translateY(${nativeTopCutoutInset}px)`
                    : undefined,"""
          s, count = native_style_pattern.subn(
              native_style_replacement,
              s,
              count=1
          )
          if count != 1:
              raise SystemExit(
                  f'portrait camera-cutout game offset: expected 1 match, found {count}'
              )

          # APK haptics: prefer the native Android bridge because WebView's
          # navigator.vibrate() is not reliable on every device/WebView build.
          vibrate_pattern = re.compile(
              r"  const vibrateNow = \(ms: number\) => \{\n"
              r"    try \{\n"
              r".*?"
              r"    \} catch \{\}\n"
              r"  \};",
              re.DOTALL,
          )
          vibrate_replacement = """  const vibrateNow = (ms: number) => {
            const duration = Math.max(18, Math.round(ms));
            try {
              const nativeBridge = (window as any).CvdNative;
              if (nativeBridge && typeof nativeBridge.vibrate === 'function') {
                nativeBridge.vibrate(duration);
                return;
              }
            } catch {}
            try {
              const nav = typeof navigator !== 'undefined'
                ? (navigator as Navigator & { vibrate?: (p: number | number[]) => boolean })
                : null;
              if (!nav || typeof nav.vibrate !== 'function') return;
              nav.vibrate(0);
              nav.vibrate(duration);
            } catch {}
          };"""
          s, count = vibrate_pattern.subn(vibrate_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'vibrateNow block: expected 1 match, found {count}')

          # Portrait native controls: center the 152px control row vertically
          # in the space below the game instead of letting it touch the phone bottom.
          replace_once(
              'className={`w-full shrink-0 overflow-hidden px-2 pt-2 touch-none ${isNativeApp ? \'pb-0 -mt-2\' : \'pb-[calc(env(safe-area-inset-bottom)+0.5rem)]\'}`}',
              'className={`w-full shrink-0 overflow-hidden px-2 touch-none ${isNativeApp ? \'py-[clamp(24px,4vh,48px)]\' : \'pt-2 pb-[calc(env(safe-area-inset-bottom)+0.5rem)]\'}`}',
              'portrait control centering'
          )

          p.write_text(s)
          print('Android layout/controller/native-haptics/portrait-centering/cutout-offset patch applied successfully')
          PY

      - name: Build web game
        run: npm run build

      - name: Create Android project
        shell: bash
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Add Android vibration permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.VIBRATE" />'
          if permission not in s:
              manifest_start = s.find('<manifest')
              if manifest_start < 0:
                  raise SystemExit('Could not find <manifest> opening tag')
              manifest_end = s.find('>', manifest_start)
              if manifest_end < 0:
                  raise SystemExit('Could not find end of <manifest> opening tag')
              s = s[:manifest_end + 1] + '\n    ' + permission + s[manifest_end + 1:]
              p.write_text(s)
          print('Android VIBRATE permission present')
          PY

      - name: Add native Android controller bridge and immersive fullscreen
        shell: bash
        run: |
          MAIN='android/app/src/main/java/com/team2go/cavemanvsdragon/stereoall/MainActivity.java'
          mkdir -p "$(dirname "$MAIN")"
          cat > "$MAIN" <<'JAVA'
          package com.team2go.cavemanvsdragon.stereoall;

          import android.content.Context;
          import android.graphics.Point;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.os.VibratorManager;
          import android.view.InputDevice;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          import java.util.Locale;

          public class MainActivity extends BridgeActivity {

              private boolean iiRcadeDevice = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  enterImmersiveMode();
                  iiRcadeDevice = detectIiRcadeDevice();

                  if (getBridge() != null && getBridge().getWebView() != null) {
                      final WebView webView = getBridge().getWebView();
                      webView.addJavascriptInterface(
                          new CvdDeviceBridge(),
                          "CvdNative"
                      );
                      // Android exposes newly added JavaScript interfaces only
                      // after the page is reloaded. Reload once so the React app
                      // can query controller/iiRcade state from startup onward.
                      webView.reload();
                  }
              }

              @Override
              public void onResume() {
                  super.onResume();
                  enterImmersiveMode();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) enterImmersiveMode();
              }

              private void enterImmersiveMode() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      final WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                          View.SYSTEM_UI_FLAG_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }

              private boolean detectIiRcadeDevice() {
                  final String identity = (
                      Build.MANUFACTURER + " " +
                      Build.BRAND + " " +
                      Build.MODEL + " " +
                      Build.PRODUCT + " " +
                      Build.DEVICE + " " +
                      Build.HARDWARE + " " +
                      Build.BOARD + " " +
                      Build.DISPLAY + " " +
                      Build.FINGERPRINT
                  ).toLowerCase(Locale.US);

                  if (identity.contains("iircade") ||
                      identity.contains("iroro1") ||
                      identity.contains("iroro2") ||
                      identity.contains("iror01") ||
                      identity.contains("iror02")) {
                      return true;
                  }

                  // Fallback for production iiRcade hardware whose Android
                  // build strings do not expose the brand/model explicitly.
                  // Classic and Gold units use RK3399-class hardware with a
                  // 1280x1024 (5:4) cabinet display.
                  final boolean rk3399 =
                      identity.contains("rk3399") ||
                      identity.contains("rockchip");

                  try {
                      final Point size = new Point();
                      getWindowManager().getDefaultDisplay().getRealSize(size);
                      final int longSide = Math.max(size.x, size.y);
                      final int shortSide = Math.min(size.x, size.y);
                      final boolean cabinetResolution =
                          longSide == 1280 && shortSide == 1024;
                      return rk3399 && cabinetResolution;
                  } catch (Throwable ignored) {
                      return false;
                  }
              }

              private int readTopCutoutInsetDp() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.P) return 0;
                  try {
                      final WindowInsets insets =
                          getWindow().getDecorView().getRootWindowInsets();
                      if (insets == null) return 0;

                      int insetPx = 0;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          insetPx = insets
                              .getInsetsIgnoringVisibility(WindowInsets.Type.displayCutout())
                              .top;
                      }

                      if (insets.getDisplayCutout() != null) {
                          insetPx = Math.max(
                              insetPx,
                              insets.getDisplayCutout().getSafeInsetTop()
                          );
                      }

                      if (insetPx <= 0) return 0;
                      final float density =
                          Math.max(1.0f, getResources().getDisplayMetrics().density);
                      // Add a tiny visual cushion below the physical cutout.
                      return Math.max(0, Math.round(insetPx / density) + 4);
                  } catch (Throwable ignored) {
                      return 0;
                  }
              }

              private void vibratePhone(int requestedMs) {
                  final int durationMs = Math.max(18, Math.min(requestedMs, 120));
                  try {
                      final Vibrator vibrator;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          final VibratorManager manager =
                              (VibratorManager) getSystemService(Context.VIBRATOR_MANAGER_SERVICE);
                          vibrator = manager != null ? manager.getDefaultVibrator() : null;
                      } else {
                          vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      }

                      if (vibrator == null || !vibrator.hasVibrator()) return;

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          vibrator.vibrate(
                              VibrationEffect.createOneShot(
                                  durationMs,
                                  VibrationEffect.DEFAULT_AMPLITUDE
                              )
                          );
                      } else {
                          vibrator.vibrate(durationMs);
                      }
                  } catch (Throwable ignored) {
                  }
              }

              private boolean hasHardwareGameController() {
                  final int[] ids = InputDevice.getDeviceIds();
                  for (int id : ids) {
                      final InputDevice device = InputDevice.getDevice(id);
                      if (device == null || device.isVirtual()) continue;

                      final int sources = device.getSources();
                      final boolean gamepad =
                          (sources & InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD;
                      final boolean joystick =
                          (sources & InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK;
                      final boolean dpadController =
                          (sources & InputDevice.SOURCE_DPAD) == InputDevice.SOURCE_DPAD &&
                          device.getKeyboardType() != InputDevice.KEYBOARD_TYPE_ALPHABETIC;

                      if (gamepad || joystick || dpadController) return true;
                  }
                  return false;
              }

              private final class CvdDeviceBridge {
                  @JavascriptInterface
                  public boolean isIiRcade() {
                      return iiRcadeDevice;
                  }

                  @JavascriptInterface
                  public boolean hasHardwareController() {
                      return hasHardwareGameController() || iiRcadeDevice;
                  }

                  @JavascriptInterface
                  public int getTopCutoutInsetDp() {
                      return readTopCutoutInsetDp();
                  }

                  @JavascriptInterface
                  public void vibrate(int durationMs) {
                      vibratePhone(durationMs);
                  }
              }

              private static String webKeyForAndroidKeyCode(int keyCode) {
                  switch (keyCode) {
                      case KeyEvent.KEYCODE_DPAD_UP:    // 19
                          return "ArrowUp";
                      case KeyEvent.KEYCODE_DPAD_DOWN:  // 20
                          return "ArrowDown";
                      case KeyEvent.KEYCODE_DPAD_LEFT:  // 21
                          return "ArrowLeft";
                      case KeyEvent.KEYCODE_DPAD_RIGHT: // 22
                          return "ArrowRight";
                      case KeyEvent.KEYCODE_BUTTON_A:   // 96
                          return " ";
                      default:
                          return null;
                  }
              }

              private static String webCodeForAndroidKeyCode(int keyCode) {
                  switch (keyCode) {
                      case KeyEvent.KEYCODE_DPAD_UP:
                          return "ArrowUp";
                      case KeyEvent.KEYCODE_DPAD_DOWN:
                          return "ArrowDown";
                      case KeyEvent.KEYCODE_DPAD_LEFT:
                          return "ArrowLeft";
                      case KeyEvent.KEYCODE_DPAD_RIGHT:
                          return "ArrowRight";
                      case KeyEvent.KEYCODE_BUTTON_A:
                          return "Space";
                      default:
                          return "";
                  }
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent event) {
                  final int androidKeyCode = event.getKeyCode();
                  final String webKey = webKeyForAndroidKeyCode(androidKeyCode);

                  if (webKey != null &&
                      (event.getAction() == KeyEvent.ACTION_DOWN || event.getAction() == KeyEvent.ACTION_UP)) {
                      final boolean down = event.getAction() == KeyEvent.ACTION_DOWN;
                      dispatchControllerKeyToGame(
                          down ? "keydown" : "keyup",
                          webKey,
                          webCodeForAndroidKeyCode(androidKeyCode),
                          androidKeyCode,
                          event.getRepeatCount() > 0
                      );
                      return true;
                  }

                  return super.dispatchKeyEvent(event);
              }

              private void dispatchControllerKeyToGame(
                  String eventType,
                  String key,
                  String code,
                  int androidKeyCode,
                  boolean repeat
              ) {
                  if (getBridge() == null) return;
                  final WebView webView = getBridge().getWebView();
                  if (webView == null) return;

                  final String escapedKey = jsString(key);
                  final String escapedCode = jsString(code);
                  final String js =
                      "(function(){" +
                      "var e=new KeyboardEvent('" + eventType + "',{" +
                      "key:" + escapedKey + "," +
                      "code:" + escapedCode + "," +
                      "bubbles:true,cancelable:true,repeat:" + repeat + "});" +
                      "try{Object.defineProperty(e,'keyCode',{get:function(){return " + androidKeyCode + ";}});" +
                      "Object.defineProperty(e,'which',{get:function(){return " + androidKeyCode + ";}});}catch(_){}" +
                      "window.dispatchEvent(e);" +
                      "})();";

                  webView.post(() -> webView.evaluateJavascript(js, null));
              }

              private static String jsString(String value) {
                  if (value == null) return "''";
                  return "'" + value
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                      .replace("\r", "\\r")
                      .replace("\n", "\\n") + "'";
              }
          }
          JAVA

      - name: Set app version and Android 16 target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/variables.gradle')
          s = p.read_text()
          import re
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)
          PY

      - name: Restore persistent test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: caveman-vs-dragon-debug-keystore-v1

      - name: Create persistent test signing key if needed
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Team2Go,C=US"
          fi

      - name: Build signed debug APK
        working-directory: android
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee CavemanVsDragon-debug.apk.sha256
          cp "$APK" CavemanVsDragon-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CavemanVsDragon-Android-APK
          path: |
            CavemanVsDragon-debug.apk
            CavemanVsDragon-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
