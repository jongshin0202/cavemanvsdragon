      - name: Harden Android background lifecycle against delayed audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mains = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if len(mains) != 1:
              raise SystemExit(f'Expected one MainActivity.java, found {len(mains)}')

          p = mains[0]
          s = p.read_text()

          # ----------------------------------------------------------
          # 1. Set persistent Android background flag as soon as the
          #    existing native background event fires.
          # ----------------------------------------------------------
          bg_plain = (
              "\"window.dispatchEvent(new Event('cvd-native-app-background'));\","
          )
          bg_flagged = (
              "\"window.__cvdAndroidBackgrounded=true;"
              "document.querySelectorAll('audio,video').forEach(function(m){"
              "try{m.pause();}catch(e){}});"
              "window.dispatchEvent(new Event('cvd-native-app-background'));\","
          )

          if bg_plain in s:
              s = s.replace(bg_plain, bg_flagged, 1)
              print('OK: native background flag added')
          elif '__cvdAndroidBackgrounded=true' in s:
              print('OK: native background flag already present')
          else:
              raise SystemExit('Native background event string not found')

          # ----------------------------------------------------------
          # 2. Pause WebView JavaScript timers while Android is in the
          #    background. Do NOT depend on a specific local WebView
          #    variable or a webView.onPause() line.
          # ----------------------------------------------------------
          if 'pauseTimers();' not in s:
              pause_method = s.find('public void onPause()')
              if pause_method < 0:
                  raise SystemExit('MainActivity onPause() method not found')

              pause_super = s.find('super.onPause();', pause_method)
              if pause_super < 0:
                  raise SystemExit('super.onPause() not found inside onPause()')

              pause_insert = (
                  "                  if (getBridge() != null && "
                  "getBridge().getWebView() != null) {\n"
                  "                      getBridge().getWebView().pauseTimers();\n"
                  "                  }\n\n"
              )

              s = s[:pause_super] + pause_insert + s[pause_super:]
              print('OK: WebView timers pause in background')
          else:
              print('OK: WebView pauseTimers already present')

          # ----------------------------------------------------------
          # 3. Resume timers on foreground and explicitly open the
          #    persistent media gate. Again, use the method boundary
          #    instead of assuming the existing WebView variable name.
          # ----------------------------------------------------------
          needs_resume_timers = 'resumeTimers();' not in s
          needs_foreground_event = 'cvd-native-app-foreground' not in s

          if needs_resume_timers or needs_foreground_event:
              resume_method = s.find('public void onResume()')
              if resume_method < 0:
                  raise SystemExit('MainActivity onResume() method not found')

              resume_super = s.find('super.onResume();', resume_method)
              if resume_super < 0:
                  raise SystemExit('super.onResume() not found inside onResume()')

              resume_line_end = s.find('\n', resume_super)
              if resume_line_end < 0:
                  raise SystemExit('Could not locate end of super.onResume() line')
              resume_line_end += 1

              resume_insert = (
                  "\n"
                  "                  if (getBridge() != null && "
                  "getBridge().getWebView() != null) {\n"
                  "                      final WebView cvdResumeWebView = "
                  "getBridge().getWebView();\n"
                  "                      cvdResumeWebView.resumeTimers();\n"
                  "                      cvdResumeWebView.evaluateJavascript(\n"
                  "                          \"window.__cvdAndroidBackgrounded=false;"
                  "window.dispatchEvent(new Event('cvd-native-app-foreground'));\",\n"
                  "                          null\n"
                  "                      );\n"
                  "                  }\n"
              )

              s = s[:resume_line_end] + resume_insert + s[resume_line_end:]
              print('OK: WebView timers resume and foreground audio gate opens')
          else:
              print('OK: native foreground lifecycle already hardened')

          p.write_text(s)

          check = p.read_text()
          required = {
              'background flag':
                  '__cvdAndroidBackgrounded=true' in check,
              'foreground flag':
                  '__cvdAndroidBackgrounded=false' in check,
              'background event':
                  'cvd-native-app-background' in check,
              'background media pause':
                  "querySelectorAll('audio,video')" in check,
              'foreground event':
                  'cvd-native-app-foreground' in check,
              'pauseTimers':
                  'pauseTimers();' in check,
              'resumeTimers':
                  'resumeTimers();' in check,
              'onPause method':
                  'public void onPause()' in check,
              'onResume method':
                  'public void onResume()' in check,
          }

          failed = [name for name, ok in required.items() if not ok]
          for name, ok in required.items():
              print(('OK: ' if ok else 'FAIL: ') + name)

          if failed:
              raise SystemExit(
                  'Fix 9 native verification failed: ' + ', '.join(failed)
              )

          print('ALL FIX 9 NATIVE LIFECYCLE ASSERTIONS PASSED.')
          PY

      - name: Set app version and Android 16 target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/variables.gradle')
          s = p.read_text()
          s = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', s)
          s = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', s)
          p.write_text(s)

          p = Path('android/app/build.gradle')
          s = p.read_text()
          s, code_count = re.subn(r'versionCode\s+\d+', 'versionCode 113', s, count=1)
          s, name_count = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.0"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Unable to set Android versionCode/versionName')
          p.write_text(s)
          PY

      - name: Restore persistent test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: caveman-vs-dragon-debug-keystore-v1

      - name: Create persistent test signing key if needed
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Team2Go,C=US"
          fi

      - name: Restore Google Play upload signing key
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/cvd-signing"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cvd-signing/upload.jks"
          chmod 600 "$RUNNER_TEMP/cvd-signing/upload.jks"
          test -s "$RUNNER_TEMP/cvd-signing/upload.jks"

      - name: Build signed debug APK and release AAB
        working-directory: android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_UPLOAD_STORE_PASSWORD"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          ./gradlew --no-daemon clean assembleDebug bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/cvd-signing/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_UPLOAD_KEY_PASSWORD"

      - name: Verify Android packages exist
        shell: bash
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ secrets.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          AAB='android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          ls -lh "$APK" "$AAB"
          # Google Play upload certificates are normally self-signed. Without
          # -strict, jarsigner still exits nonzero for an invalid signature but
          # does not turn the expected self-signed-chain warning into failure.
          jarsigner -verify -verbose -certs "$AAB"

          test -n "$ANDROID_UPLOAD_CERT_SHA256"
          ACTUAL_CERT_SHA256="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT_SHA256"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar"
          curl -fL --retry 3 \
            'https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar' \
            -o "$BUNDLETOOL"
          VERSION_CODE="$(java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB" --xpath='/manifest/@android:versionCode')"
          VERSION_NAME="$(java -jar "$BUNDLETOOL" dump manifest --bundle="$AAB" --xpath='/manifest/@android:versionName')"
          test "$VERSION_CODE" = '113'
          test "$VERSION_NAME" = '1.0'

          rm -rf "$RUNNER_TEMP/cvd-aab"
          mkdir -p "$RUNNER_TEMP/cvd-aab"
          unzip -q "$AAB" 'base/assets/public/assets/*.js' -d "$RUNNER_TEMP/cvd-aab"
          rg -q 'cavemanvsdragon-api\.jwshin1\.workers\.dev' "$RUNNER_TEMP/cvd-aab" --glob '*.js'
          rg -q 'leaderboard-profiles/session' "$RUNNER_TEMP/cvd-aab" --glob '*.js'
          rg -q 'This password lets you use this leaderboard name on other devices' "$RUNNER_TEMP/cvd-aab" --glob '*.js'
          rg -q 'Password Saved' "$RUNNER_TEMP/cvd-aab" --glob '*.js'
          rg -q 'OK' "$RUNNER_TEMP/cvd-aab" --glob '*.js'
          if rg -q 'Use Name' "$RUNNER_TEMP/cvd-aab" --glob '*.js'; then
            echo 'Obsolete Use Name button label is still packaged in the AAB.' >&2
            exit 1
          fi

          sha256sum "$APK" | tee CavemanVsDragon-debug.apk.sha256
          sha256sum "$AAB" | tee CavemanVsDragon-release.aab.sha256
          cp "$APK" CavemanVsDragon-debug.apk
          cp "$AAB" CavemanVsDragon-release.aab

      - name: Remove Google Play upload signing key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/cvd-signing"

      - name: Upload Android package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Caveman-Vs-Dragon-Android
          path: |
            CavemanVsDragon-debug.apk
            CavemanVsDragon-debug.apk.sha256
            CavemanVsDragon-release.aab
            CavemanVsDragon-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
